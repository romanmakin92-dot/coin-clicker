<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>МонетоКликер — Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0500;
            overflow-x: hidden;
        }

        @keyframes pulse {
            0% { opacity: 0.03; }
            100% { opacity: 0.12; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(60px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes coinPop {
            0% { opacity: 1; transform: translate(-50%,-50%) scale(1.4); }
            100% { opacity: 0; transform: translate(-50%,-180%) scale(0.7); }
        }

        @keyframes ripple {
            0% { width: 0; height: 0; opacity: 0.7; }
            100% { width: 200px; height: 200px; opacity: 0; }
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(251,191,36,0.3); }
            50% { box-shadow: 0 0 60px rgba(251,191,36,0.7); }
        }

        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(120,53,15,0.1);
            border-radius: 3px;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(251,191,36,0.3);
            border-radius: 3px;
        }
    </style>
</head>

        // ─────────────────────────────────────────────
        const fmt = (n) => {
            if (typeof n !== 'number' || isNaN(n)) n = 0;
            if (n >= 1e18) return (n / 1e18).toFixed(2) + "Кв";
            if (n >= 1e15) return (n / 1e15).toFixed(2) + "Кд";
            if (n >= 1e12) return (n / 1e12).toFixed(2) + "Т";
            if (n >= 1e9) return (n / 1e9).toFixed(2) + "М";
            if (n >= 1e6) return (n / 1e6).toFixed(2) + "млн";
            if (n >= 1e3) return (n / 1e3).toFixed(2) + "к";
            return Math.floor(n).toLocaleString("ru-RU");
        };

        const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

            { id: "q_building_5", name: "Застройщик", desc: "5 зданий одного типа", icon: "🏗️", condition: (s) => s.buildings.some((b) => b.count >= 5), reward: 10000, rewardType: "coins" },
            { id: "q_building_25", name: "Магнат", desc: "25 зданий одного типа", icon: "🏙️", condition: (s) => s.buildings.some((b) => b.count >= 25), reward: 500000, rewardType: "coins" },

            { id: "q_prestige_3", name: "Ветеран", desc: "3 престижа", icon: "🌠", condition: (s) => s.prestigeLevel >= 3, reward: 3, rewardType: "prestige_pts" },

        const ACHIEVEMENTS = [

            { id: "coins_10000", name: "Состоятельный", desc: "10 000 монет", icon: "💎", condition: (s) => s.totalCoins >= 10000 },
            { id: "coins_1m", name: "Миллионер", desc: "1 000 000 монет", icon: "🤑", condition: (s) => s.totalCoins >= 1000000 },
            { id: "coins_1b", name: "Миллиардер", desc: "1 млрд монет", icon: "👑", condition: (s) => s.totalCoins >= 1000000000 },
            { id: "coins_1t", name: "Триллионер", desc: "1 трлн монет", icon: "🌌", condition: (s) => s.totalCoins >= 1e12 },
            { id: "coins_1q", name: "Квадриллионер", desc: "1 квд монет", icon: "🌠", condition: (s) => s.totalCoins >= 1e15 },
            { id: "first_building", name: "Застройщик", desc: "Первое здание", icon: "🏗️", condition: (s) => s.buildings.some((b) => b.count > 0) },
            { id: "all_buildings", name: "Магнат", desc: "Все типы зданий", icon: "🏙️", condition: (s) => s.buildings.every((b) => b.count > 0) },
            { id: "bank_investor", name: "Инвестор", desc: "Открой вклад", icon: "🏦", condition: (s) => s.bankDeposits.length > 0 || s.bankBalance > 0 },
            { id: "prestige_1", name: "Перерождение", desc: "Первый престиж", icon: "🌟", condition: (s) => s.prestigeLevel >= 1 },
            { id: "prestige_5", name: "Ветеран Престижа", desc: "5 престижей", icon: "🌠", condition: (s) => s.prestigeLevel >= 5 },
            { id: "prestige_10", name: "Мастер Престижа", desc: "10 престижей", icon: "💫", condition: (s) => s.prestigeLevel >= 10 },
            { id: "mega_prestige_1", name: "Мега-Перерождение", desc: "Первое Мега-Перерождение", icon: "🔥", condition: (s) => s.megaPrestigeLevel >= 1 },
            { id: "mega_prestige_3", name: "Мега-Ветеран", desc: "3 Мега-Перерождения", icon: "💥", condition: (s) => s.megaPrestigeLevel >= 3 },

            { id: "relic_first", name: "Коллекционер", desc: "Первая реликвия", icon: "🥚", condition: (s) => s.relics.some((r) => r.owned) },
            { id: "relic_all", name: "Хранитель реликвий", desc: "Все реликвии", icon: "🏺", condition: (s) => s.relics.every((r) => r.owned) },
            { id: "cps_1000", name: "Фабрика", desc: "1000 монет/сек", icon: "⚙️", condition: (s) => s.coinsPerSecond >= 1000 },
            { id: "cps_1m", name: "Мегафабрика", desc: "1 млн монет/сек", icon: "🏭", condition: (s) => s.coinsPerSecond >= 1000000 },
            { id: "cps_1b", name: "Планетарная фабрика", desc: "1 млрд монет/сек", icon: "🌍", condition: (s) => s.coinsPerSecond >= 1000000000 },
            { id: "quest_5", name: "Авантюрист", desc: "5 квестов выполнено", icon: "📜", condition: (s) => s.quests.filter((q) => q.completed).length >= 5 },
            { id: "quest_all", name: "Легенда квестов", desc: "Все квесты выполнены", icon: "📖", condition: (s) => s.quests.every((q) => q.completed) },
        ];

        const EVENTS = [
            { id: "coin_rain", name: "Золотой дождь", desc: "x3 к доходу на 30 сек!", icon: "🌧️", duration: 30, multiplier: 3, color: "#f59e0b" },
            { id: "frenzy", name: "Монетное безумие", desc: "x7 к кликам на 15 сек!", icon: "🌀", duration: 15, clickMult: 7, color: "#8b5cf6" },
            { id: "lucky_day", name: "Счастливый день", desc: "x5 ко всему на 20 сек!", icon: "🍀", duration: 20, multiplier: 5, color: "#10b981" },
            { id: "time_boost", name: "Ускорение времени", desc: "x10 к пассивному доходу на 10 сек!", icon: "⚡", duration: 10, cpsMult: 10, color: "#06b6d4" },
        ];

        // ─────────────────────────────────────────────
        // DEFAULT STATE
        // ─────────────────────────────────────────────
        const defaultState = () => ({
            coins: 0,
            totalCoins: 0,
            totalAllTimeCoins: 0,
            coinsPerClick: 1,
            coinsPerSecond: 0,
            totalClicks: 0,
            totalAllTimeClicks: 0,
            upgrades: UPGRADES.map((u) => ({ id: u.id, level: 0 })),
            buildings: BUILDINGS.map((b) => ({ id: b.id, count: 0 })),
            bankBalance: 0,
            bankDeposits: [],
            achievements: ACHIEVEMENTS.map((a) => ({ id: a.id, unlocked: false })),
            quests: QUESTS.map((q) => ({ id: q.id, completed: false, claimed: false })),
            relics: RELICS.map((r) => ({ id: r.id, owned: false })),
            prestigeLevel: 0,
            prestigeMultiplier: 1,
            prestigePoints: 0,
            totalPrestigePoints: 0,
            megaPrestigeLevel: 0,
            megaPrestigeMultiplier: 1,
            megaPrestigePoints: 0,
            hyperPrestigeLevel: 0,
            hyperPrestigeMultiplier: 1,
            activeEvent: null,
            eventMultiplier: 1,
            eventClickMult: 1,
            eventCpsMult: 1,
            lastSaved: Date.now(),
            playTime: 0,
        });

        // ─────────────────────────────────────────────
        // LOAD / SAVE
        // ─────────────────────────────────────────────
        const loadState = () => {
            try {
                const rawNew = localStorage.getItem(NEW_SAVE_KEY);
                if (rawNew) {
                    const parsed = JSON.parse(rawNew);
                    const def = defaultState();
                    return mergeState(def, parsed);
                }
                const rawOld = localStorage.getItem(SAVE_KEY);
                if (rawOld) {
                    const parsed = JSON.parse(rawOld);
                    const def = defaultState();
                    return mergeState(def, parsed);
                }
                return defaultState();
            } catch {
                return defaultState();
            }
        };

        const mergeState = (def, parsed) => ({
            ...def,
            ...parsed,
            upgrades: def.upgrades.map((u) => {
                const s = parsed.upgrades?.find((x) => x.id === u.id);
                return s ? { ...u, level: s.level || 0 } : u;
            }),
            buildings: def.buildings.map((b) => {
                const s = parsed.buildings?.find((x) => x.id === b.id);
                return s ? { ...b, count: s.count || 0 } : b;
            }),
            achievements: def.achievements.map((a) => {
                const s = parsed.achievements?.find((x) => x.id === a.id);
                return s ? { ...a, unlocked: s.unlocked || false } : a;
            }),
            quests: def.quests.map((q) => {
                const s = parsed.quests?.find((x) => x.id === q.id);
                return s ? { ...q, completed: s.completed || false, claimed: s.claimed || false } : q;
            }),
            relics: def.relics.map((r) => {
                const s = parsed.relics?.find((x) => x.id === r.id);
                return s ? { ...r, owned: s.owned || false } : r;
            }),
            bankDeposits: parsed.bankDeposits || [],
            prestigeLevel: parsed.prestigeLevel || 0,
            prestigeMultiplier: parsed.prestigeMultiplier || 1,
            prestigePoints: parsed.prestigePoints || 0,
            totalPrestigePoints: parsed.totalPrestigePoints || parsed.prestigePoints || 0,
            megaPrestigeLevel: parsed.megaPrestigeLevel || 0,
            megaPrestigeMultiplier: parsed.megaPrestigeMultiplier || 1,
            megaPrestigePoints: parsed.megaPrestigePoints || 0,
            hyperPrestigeLevel: parsed.hyperPrestigeLevel || 0,
            hyperPrestigeMultiplier: parsed.hyperPrestigeMultiplier || 1,
            totalAllTimeCoins: parsed.totalAllTimeCoins || parsed.totalCoins || 0,
            totalAllTimeClicks: parsed.totalAllTimeClicks || parsed.totalClicks || 0,
            activeEvent: null,
            eventMultiplier: 1,
            eventClickMult: 1,
            eventCpsMult: 1,
            playTime: parsed.playTime || 0,
        });

        // ─────────────────────────────────────────────
        // CALCULATIONS
        // ─────────────────────────────────────────────
        const calcRelicMult = (relics, type) => {
            let m = 1;
            relics.forEach((r) => {
                if (!r.owned) return;
                const def = RELICS.find((x) => x.id === r.id);
                if (!def) return;
                if (def.type === "multiplier") m *= def.value;
                else if (def.type === type) m *= def.value;
            });
            return m;
        };

        const calcCPC = (state) => {
            const ups = UPGRADES.reduce((s, u) => {
                const saved = state.upgrades.find((x) => x.id === u.id);
                return s + u.cpc * (saved?.level || 0);
            }, 0);
            const base = 1 + ups;
            const relicMult = calcRelicMult(state.relics, "cpc_mult");
            return Math.floor(base * state.prestigeMultiplier * state.megaPrestigeMultiplier * state.hyperPrestigeMultiplier * relicMult * state.eventClickMult);
        };

        const calcCPS = (state) => {
            const fromUps = UPGRADES.reduce((s, u) => {
                const saved = state.upgrades.find((x) => x.id === u.id);
                return s + u.cps * (saved?.level || 0);
            }, 0);
            const fromBlds = BUILDINGS.reduce((s, b) => {
                const saved = state.buildings.find((x) => x.id === b.id);
                return s + b.cps * (saved?.count || 0);
            }, 0);
            const relicMult = calcRelicMult(state.relics, "cps_mult");
            return (fromUps + fromBlds) * state.prestigeMultiplier * state.megaPrestigeMultiplier * state.hyperPrestigeMultiplier * relicMult * state.eventMultiplier * state.eventCpsMult;
        };

        const PRESTIGE_REQ = 1000000;
        const MEGA_PRESTIGE_REQ = 10;
        const HYPER_PRESTIGE_REQ = 3;

        // Telegram Cloud Storage функции
        const saveToTelegramCloud = (state) => {
            if (!tg) return;
            try {
                const saveData = {
                    coins: state.coins,
                    totalCoins: state.totalCoins,
                    totalAllTimeCoins: state.totalAllTimeCoins,
                    totalClicks: state.totalClicks,
                    totalAllTimeClicks: state.totalAllTimeClicks,
                    bankBalance: state.bankBalance,
                    bankDeposits: state.bankDeposits,
                    prestigeLevel: state.prestigeLevel,
                    prestigeMultiplier: state.prestigeMultiplier,
                    prestigePoints: state.prestigePoints,
                    totalPrestigePoints: state.totalPrestigePoints,
                    megaPrestigeLevel: state.megaPrestigeLevel,
                    megaPrestigeMultiplier: state.megaPrestigeMultiplier,
                    megaPrestigePoints: state.megaPrestigePoints,
                    hyperPrestigeLevel: state.hyperPrestigeLevel,
                    hyperPrestigeMultiplier: state.hyperPrestigeMultiplier,
                    playTime: state.playTime,
                    upgrades: state.upgrades,
                    buildings: state.buildings,
                    achievements: state.achievements,
                    quests: state.quests,
                    relics: state.relics,
                };
                tg.CloudStorage.setItem(TELEGRAM_SAVE_KEY, JSON.stringify(saveData), (err) => {
                    if (err) console.error("Cloud save error:", err);
                });
            } catch(e) { console.error("Cloud save error:", e); }
        };

        const loadFromTelegramCloud = () => {
            if (!tg) return Promise.resolve(null);
            return new Promise((resolve) => {
                tg.CloudStorage.getItem(TELEGRAM_SAVE_KEY, (err, data) => {
                    if (err || !data) {
                        resolve(null);
                    } else {
                        try {
                            resolve(JSON.parse(data));
                        } catch {
                            resolve(null);
                        }
                    }
                });
            });
        };

        // ─────────────────────────────────────────────
        // HOOK
        // ─────────────────────────────────────────────
        const useGame = () => {
            const [state, setState] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const ref = useRef(state);
            ref.current = state;

            useEffect(() => {
                const load = async () => {
                    const cloudSave = await loadFromTelegramCloud();
                    if (cloudSave) {
                        const def = defaultState();
                        const merged = mergeState(def, cloudSave);
                        setState(merged);
                    } else {
                        setState(loadState());
                    }
                    setIsLoading(false);
                    
                    // Сообщаем Telegram, что приложение загружено
                    if (tg) tg.ready();
                };
                load();
            }, []);

            useEffect(() => {
                if (!state) return;
                const timeout = setTimeout(() => {
                    saveToTelegramCloud(state);
                }, 1000);
                return () => clearTimeout(timeout);
            }, [state]);

            useEffect(() => {
                if (!state) return;
                const t = setInterval(() => {
                    const s = ref.current;
                    if (!s) return;
                    const toSave = {
                        coins: s.coins, totalCoins: s.totalCoins, totalAllTimeCoins: s.totalAllTimeCoins,
                        totalClicks: s.totalClicks, totalAllTimeClicks: s.totalAllTimeClicks,
                        bankBalance: s.bankBalance, bankDeposits: s.bankDeposits,
                        prestigeLevel: s.prestigeLevel, prestigeMultiplier: s.prestigeMultiplier,
                        prestigePoints: s.prestigePoints, totalPrestigePoints: s.totalPrestigePoints,
                        megaPrestigeLevel: s.megaPrestigeLevel, megaPrestigeMultiplier: s.megaPrestigeMultiplier,
                        megaPrestigePoints: s.megaPrestigePoints,
                        hyperPrestigeLevel: s.hyperPrestigeLevel, hyperPrestigeMultiplier: s.hyperPrestigeMultiplier,
                        playTime: s.playTime,
                        upgrades: s.upgrades,
                        buildings: s.buildings,
                        achievements: s.achievements,
                        quests: s.quests,
                        relics: s.relics,
                    };
                    localStorage.setItem(NEW_SAVE_KEY, JSON.stringify(toSave));
                }, 3000);
                return () => clearInterval(t);
            }, [state]);

            useEffect(() => {
                if (!state) return;
                const t = setInterval(() => {
                    setState((prev) => prev ? { ...prev, playTime: prev.playTime + 1 } : prev);
                }, 1000);
                return () => clearInterval(t);
            }, [state]);

            useEffect(() => {
                if (!state) return;
                const t = setInterval(() => {
                    setState((prev) => {
                        if (!prev) return prev;
                        const cps = calcCPS(prev);
                        if (cps === 0) return prev;
                        const earned = cps / 20;
                        return { ...prev, coins: prev.coins + earned, totalCoins: prev.totalCoins + earned, totalAllTimeCoins: prev.totalAllTimeCoins + earned };
                    });
                }, 50);
                return () => clearInterval(t);
            }, [state]);

            useEffect(() => {
                if (!state) return;
                const t = setInterval(() => {
                    setState((prev) => {
                        if (!prev) return prev;
                        if (!prev.bankDeposits.length) return prev;
                        const now = Date.now();
                        let bal = prev.bankBalance;
                        const remaining = prev.bankDeposits.filter((dep) => {
                            const elapsed = (now - dep.startTime) / 60000;
                            if (elapsed >= dep.duration) { bal += dep.amount * (1 + dep.interest / 100); return false; }
                            return true;
                        });
                        if (remaining.length === prev.bankDeposits.length) return prev;
                        return { ...prev, bankBalance: bal, bankDeposits: remaining };
                    });
                }, 1000);
                return () => clearInterval(t);
            }, [state]);

            useEffect(() => {
                if (!state) return;
                const t = setInterval(() => {
                    setState((prev) => {
                        if (!prev) return prev;
                        let changed = false;
                        const newAch = prev.achievements.map((a) => {
                            if (a.unlocked) return a;
                            const def = ACHIEVEMENTS.find((x) => x.id === a.id);
                            if (def?.condition(prev)) { changed = true; return { ...a, unlocked: true }; }
                            return a;
                        });
                        const newQ = prev.quests.map((q) => {
                            if (q.completed) return q;
                            const def = QUESTS.find((x) => x.id === q.id);
                            if (def?.condition(prev)) { changed = true; return { ...q, completed: true }; }
                            return q;
                        });
                        if (!changed) return prev;
                        return { ...prev, achievements: newAch, quests: newQ };
                    });
                }, 500);
                return () => clearInterval(t);
            }, [state]);

            useEffect(() => {
                if (!state) return;
                const t = setInterval(() => {
                    setState((prev) => {
                        if (!prev) return prev;
                        if (!prev.activeEvent) return prev;
                        if (Date.now() >= prev.activeEvent.endsAt) {
                            return { ...prev, activeEvent: null, eventMultiplier: 1, eventClickMult: 1, eventCpsMult: 1 };
                        }
                        return prev;
                    });
                }, 500);
                return () => clearInterval(t);
            }, [state]);

            useEffect(() => {
                if (!state) return;
                const t = setInterval(() => {
                    setState((prev) => {
                        if (!prev) return prev;
                        if (prev.activeEvent) return prev;
                        if (prev.totalCoins < 1000) return prev;
                        if (Math.random() < 0.005) {
                            const ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
                            return {
                                ...prev,
                                activeEvent: { id: ev.id, endsAt: Date.now() + ev.duration * 1000 },
                                eventMultiplier: ev.multiplier || 1,
                                eventClickMult: ev.clickMult || 1,
                                eventCpsMult: ev.cpsMult || 1,
                            };
                        }
                        return prev;
                    });
                }, 10000);
                return () => clearInterval(t);
            }, [state]);

            const click = useCallback(() => {
                setState((prev) => {
                    if (!prev) return prev;
                    const cpc = calcCPC(prev);
                    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
                    return {
                        ...prev,
                        coins: prev.coins + cpc,
                        totalCoins: prev.totalCoins + cpc,
                        totalAllTimeCoins: prev.totalAllTimeCoins + cpc,
                        totalClicks: prev.totalClicks + 1,
                        totalAllTimeClicks: prev.totalAllTimeClicks + 1,
                    };
                });
            }, []);

            const buyUpgrade = useCallback((id) => {
                setState((prev) => {
                    if (!prev) return prev;
                    const uDef = UPGRADES.find((u) => u.id === id);
                    if (!uDef) return prev;
                    const saved = prev.upgrades.find((u) => u.id === id);
                    if (!saved || saved.level >= uDef.maxLevel) return prev;
                    const cost = Math.floor(uDef.baseCost * Math.pow(uDef.mult, saved.level));
                    if (prev.coins < cost) return prev;
                    const newUps = prev.upgrades.map((u) => u.id === id ? { ...u, level: u.level + 1 } : u);
                    const ns = { ...prev, coins: prev.coins - cost, upgrades: newUps };
                    return { ...ns, coinsPerClick: calcCPC(ns), coinsPerSecond: calcCPS(ns) };
                });
            }, []);

            const buyBuilding = useCallback((id) => {
                setState((prev) => {
                    if (!prev) return prev;
                    const bDef = BUILDINGS.find((b) => b.id === id);
                    if (!bDef) return prev;
                    const saved = prev.buildings.find((b) => b.id === id);
                    if (!saved) return prev;
                    const cost = Math.floor(bDef.baseCost * Math.pow(bDef.mult, saved.count));
                    if (prev.coins < cost) return prev;
                    const newBlds = prev.buildings.map((b) => b.id === id ? { ...b, count: b.count + 1 } : b);
                    const ns = { ...prev, coins: prev.coins - cost, buildings: newBlds };
                    return { ...ns, coinsPerSecond: calcCPS(ns) };
                });
            }, []);

            const depositToBank = useCallback((amount, duration, interest, label) => {
                setState((prev) => {
                    if (!prev) return prev;
                    if (prev.coins < amount) return prev;
                    const dep = { id: Date.now().toString(), amount, interest, startTime: Date.now(), duration, label };
                    return { ...prev, coins: prev.coins - amount, bankDeposits: [...prev.bankDeposits, dep] };
                });
            }, []);

            const withdrawBank = useCallback(() => {
                setState((prev) => {
                    if (!prev) return prev;
                    if (prev.bankBalance <= 0) return prev;
                    return { ...prev, coins: prev.coins + prev.bankBalance, totalCoins: prev.totalCoins + prev.bankBalance, totalAllTimeCoins: prev.totalAllTimeCoins + prev.bankBalance, bankBalance: 0 };
                });
            }, []);

            const prestige = useCallback(() => {
                setState((prev) => {
                    if (!prev) return prev;
                    if (prev.totalCoins < PRESTIGE_REQ) return prev;
                    const pts = Math.floor(Math.log10(prev.totalCoins / PRESTIGE_REQ) * 3 + 1);
                    const newLevel = prev.prestigeLevel + 1;
                    const newMult = 1 + newLevel * 0.5 + prev.megaPrestigeLevel * 2 + prev.hyperPrestigeLevel * 10;
                    const fresh = defaultState();
                    return {
                        ...fresh,
                        prestigeLevel: newLevel,
                        prestigeMultiplier: newMult,
                        prestigePoints: prev.prestigePoints + pts,
                        totalPrestigePoints: prev.totalPrestigePoints + pts,
                        megaPrestigeLevel: prev.megaPrestigeLevel,
                        megaPrestigeMultiplier: prev.megaPrestigeMultiplier,
                        megaPrestigePoints: prev.megaPrestigePoints,
                        hyperPrestigeLevel: prev.hyperPrestigeLevel,
                        hyperPrestigeMultiplier: prev.hyperPrestigeMultiplier,
                        achievements: prev.achievements,
                        quests: prev.quests,
                        relics: prev.relics,
                        totalAllTimeCoins: prev.totalAllTimeCoins,
                        totalAllTimeClicks: prev.totalAllTimeClicks,
                        playTime: prev.playTime,
                    };
                });
            }, []);

            const megaPrestige = useCallback(() => {
                setState((prev) => {
                    if (!prev) return prev;
                    if (prev.prestigeLevel < MEGA_PRESTIGE_REQ) return prev;
                    const newMega = prev.megaPrestigeLevel + 1;
                    const newMegaMult = 1 + newMega * 5 + prev.hyperPrestigeLevel * 50;
                    const fresh = defaultState();
                    return {
                        ...fresh,
                        megaPrestigeLevel: newMega,
                        megaPrestigeMultiplier: newMegaMult,
                        megaPrestigePoints: prev.megaPrestigePoints + newMega * 3,
                        hyperPrestigeLevel: prev.hyperPrestigeLevel,
                        hyperPrestigeMultiplier: prev.hyperPrestigeMultiplier,
                        achievements: prev.achievements,
                        quests: prev.quests,
                        relics: prev.relics,
                        totalAllTimeCoins: prev.totalAllTimeCoins,
                        totalAllTimeClicks: prev.totalAllTimeClicks,
                        playTime: prev.playTime,
                        totalPrestigePoints: prev.totalPrestigePoints,
                    };
                });
            }, []);

            const hyperPrestige = useCallback(() => {
                setState((prev) => {
                    if (!prev) return prev;
                    if (prev.megaPrestigeLevel < HYPER_PRESTIGE_REQ) return prev;
                    const newHyper = prev.hyperPrestigeLevel + 1;
                    const newHyperMult = 1 + newHyper * 100;
                    const fresh = defaultState();
                    return {
                        ...fresh,
                        hyperPrestigeLevel: newHyper,
                        hyperPrestigeMultiplier: newHyperMult,
                        achievements: prev.achievements,
                        quests: prev.quests,
                        relics: prev.relics,
                        totalAllTimeCoins: prev.totalAllTimeCoins,
                        totalAllTimeClicks: prev.totalAllTimeClicks,
                        playTime: prev.playTime,
                        totalPrestigePoints: prev.totalPrestigePoints,
                    };
                });
            }, []);

            const buyRelic = useCallback((id) => {
                setState((prev) => {
                    if (!prev) return prev;
                    const def = RELICS.find((r) => r.id === id);
                    if (!def) return prev;
                    const owned = prev.relics.find((r) => r.id === id)?.owned;
                    if (owned) return prev;
                    if (prev.prestigePoints < def.cost) return prev;
                    const newRelics = prev.relics.map((r) => r.id === id ? { ...r, owned: true } : r);
                    const ns = { ...prev, prestigePoints: prev.prestigePoints - def.cost, relics: newRelics };
                    return { ...ns, coinsPerClick: calcCPC(ns), coinsPerSecond: calcCPS(ns) };
                });
            }, []);

            const claimQuest = useCallback((id) => {
                setState((prev) => {
                    if (!prev) return prev;
                    const q = prev.quests.find((x) => x.id === id);
                    if (!q || !q.completed || q.claimed) return prev;
                    const def = QUESTS.find((x) => x.id === id);
                    if (!def) return prev;
                    let newState = { ...prev, quests: prev.quests.map((x) => x.id === id ? { ...x, claimed: true } : x) };
                    if (def.rewardType === "coins") {
                        newState = { ...newState, coins: newState.coins + def.reward, totalCoins: newState.totalCoins + def.reward, totalAllTimeCoins: newState.totalAllTimeCoins + def.reward };
                    } else if (def.rewardType === "prestige_pts") {
                        newState = { ...newState, prestigePoints: newState.prestigePoints + def.reward, totalPrestigePoints: newState.totalPrestigePoints + def.reward };
                    }
                    return newState;
                });
            }, []);

            const triggerEvent = useCallback((id) => {
                setState((prev) => {
                    if (!prev) return prev;
                    const ev = EVENTS.find((e) => e.id === id);
                    if (!ev || prev.activeEvent) return prev;
                    return {
                        ...prev,
                        activeEvent: { id: ev.id, endsAt: Date.now() + ev.duration * 1000 },
                        eventMultiplier: ev.multiplier || 1,
                        eventClickMult: ev.clickMult || 1,
                        eventCpsMult: ev.cpsMult || 1,
                    };
                });
            }, []);

            const resetGame = useCallback(() => {
                if (confirm("Удалить ВЕСЬ прогресс навсегда?")) {
                    localStorage.removeItem(NEW_SAVE_KEY);
                    localStorage.removeItem(SAVE_KEY);
                    if (tg) tg.CloudStorage.removeItem(TELEGRAM_SAVE_KEY);
                    setState(defaultState());
                }
            }, []);

            const getCPS = () => state ? calcCPS(state) : 0;
            const getCPC = () => state ? calcCPC(state) : 0;

            const shareProgress = useCallback(() => {
                if (!tg || !state) return;
                tg.sendData(JSON.stringify({
                    type: "share",
                    coins: state.totalAllTimeCoins,
                    prestige: state.prestigeLevel,
                    megaPrestige: state.megaPrestigeLevel,
                    hyperPrestige: state.hyperPrestigeLevel,
                }));
            }, [state]);

            return { state, click, buyUpgrade, buyBuilding, depositToBank, withdrawBank, prestige, megaPrestige, hyperPrestige, buyRelic, claimQuest, triggerEvent, resetGame, getCPS, getCPC, shareProgress, isLoading };
        };

        // ─────────────────────────────────────────────
        // LEADERBOARD
        // ─────────────────────────────────────────────
        const LEADERBOARD_KEY = "coin_clicker_leaderboard";
        const saveLeaderboard = (name, score) => {
            try {
                const raw = localStorage.getItem(LEADERBOARD_KEY);
                const board = raw ? JSON.parse(raw) : [];
                const existing = board.findIndex((e) => e.name === name);
                if (existing >= 0) { board[existing].score = Math.max(board[existing].score, score); board[existing].updated = Date.now(); }
                else board.push({ name, score, updated: Date.now() });
                board.sort((a, b) => b.score - a.score);
                localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(board.slice(0, 20)));
            } catch {}
        };
        
        const loadLeaderboard = () => {
            try { return JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || "[]"); } catch { return []; }
        };

        // ─────────────────────────────────────────────
        // COMPONENTS
        // ─────────────────────────────────────────────
        const Tab = ({ id, label, icon, active, onClick, badge }) => (
            <button onClick={() => onClick(id)} className={`relative flex-1 min-w-fit px-2 py-2 rounded-lg text-xs font-bold transition-all whitespace-nowrap flex flex-col items-center gap-0.5 ${active ? "bg-amber-600 text-white shadow-lg shadow-amber-900/50" : "text-amber-700 hover:text-amber-400 hover:bg-amber-900/30"}`}>
                <span className="text-base">{icon}</span>
                <span className="hidden sm:block">{label}</span>
                {badge > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center font-black">{badge}</span>}
            </button>
        );

        const PrestigeCard = ({ title, icon, desc, level, canDo, req, current, onDo, color, pts, ptsLabel }) => {
            const pct = Math.min((current / req) * 100, 100);
            return (
                <div className={`rounded-2xl border p-4 ${color}`}>
                    <div className="flex items-center justify-between mb-1">
                        <span className="font-black text-sm flex items-center gap-1">{icon} {title}</span>
                        <span className="text-xs opacity-70">Ур. {level}</span>
                    </div>
                    <p className="text-xs opacity-60 mb-2">{desc}</p>
                    {pts !== undefined && <p className="text-xs mb-2 opacity-80">{ptsLabel}: <b>{pts}</b></p>}
                    <div className="mb-2">
                        <div className="flex justify-between text-xs opacity-50 mb-1"><span>Прогресс</span><span>{fmt(current)} / {fmt(req)}</span></div>
                        <div className="bg-black/30 rounded-full h-2"><div className="h-2 rounded-full transition-all" style={{ width: `${pct}%`, background: "linear-gradient(90deg,#f59e0b,#fbbf24)" }} /></div>
                    </div>
                    <button onClick={onDo} disabled={!canDo} className={`w-full font-bold py-2 rounded-lg text-sm transition-all ${canDo ? "bg-amber-500 hover:bg-amber-400 text-black cursor-pointer" : "bg-black/20 opacity-40 cursor-not-allowed text-white"}`}>
                        {canDo ? `✨ ${title}!` : `Нужно ${fmt(req)}`}
                    </button>
                </div>
            );
        };

        const CoinBtn = ({ onClick, cpc, activeEv }) => {
            const [particles, setParticles] = useState([]);
            const [ripples, setRipples] = useState([]);
            const [pressing, setPressing] = useState(false);
            const pid = useRef(0);

            const handleClick = (e) => {
                onClick();
                const id = pid.current++;
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                setParticles((p) => [...p, { id, x, y, val: cpc }]);
                setRipples((r) => [...r, { id, x, y }]);
                setTimeout(() => {
                    setParticles((p) => p.filter((x) => x.id !== id));
                    setRipples((r) => r.filter((x) => x.id !== id));
                }, 700);
            };

            const glowColor = activeEv ? (activeEv.color || "#fbbf24") : "#fbbf24";
            const emoji = activeEv?.id === "frenzy" ? "🌀" : activeEv?.id === "coin_rain" ? "🌧️" : activeEv?.id === "lucky_day" ? "🍀" : activeEv?.id === "time_boost" ? "⚡" : "💰";

            return (
                <div style={{ position: "relative", width: 180, height: 180, margin: "0 auto" }}>
                    <button
                        onMouseDown={() => setPressing(true)}
                        onMouseUp={() => setPressing(false)}
                        onMouseLeave={() => setPressing(false)}
                        onTouchStart={() => setPressing(true)}
                        onTouchEnd={() => setPressing(false)}
                        onClick={handleClick}
                        style={{
                            width: "100%", height: "100%", borderRadius: "50%",
                            background: `radial-gradient(circle at 35% 35%, ${glowColor}aa, ${glowColor}33)`,
                            border: `3px solid ${glowColor}88`,
                            cursor: "pointer", fontSize: 70, display: "flex", alignItems: "center", justifyContent: "center",
                            transform: pressing ? "scale(0.93)" : "scale(1)",
                            transition: "transform 0.1s",
                            animation: "glowPulse 2s ease-in-out infinite",
                            position: "relative", overflow: "hidden",
                            boxShadow: `0 0 ${pressing ? 20 : 40}px ${glowColor}55`,
                            userSelect: "none",
                        }}
                    >
                        <span style={{ position: "relative", zIndex: 2 }}>{emoji}</span>
                    </button>
                    {ripples.map((r) => (
                        <div key={r.id} style={{ position: "absolute", borderRadius: "50%", border: `2px solid ${glowColor}88`, pointerEvents: "none", left: r.x, top: r.y, transform: "translate(-50%,-50%)", animation: "ripple 0.6s ease-out forwards" }} />
                    ))}
                    {particles.map((p) => (
                        <div key={p.id} style={{ position: "absolute", left: p.x, top: p.y, color: "#fbbf24", fontWeight: 900, fontSize: 16, pointerEvents: "none", whiteSpace: "nowrap", animation: "coinPop 0.65s ease-out forwards", zIndex: 10 }}>
                            +{fmt(p.val)}
                        </div>
                    ))}
                </div>
            );
        };

        // ─────────────────────────────────────────────
        // MAIN APP
        // ─────────────────────────────────────────────
        function App() {
            const { state, click, buyUpgrade, buyBuilding, depositToBank, withdrawBank, prestige, megaPrestige, hyperPrestige, buyRelic, claimQuest, triggerEvent, resetGame, getCPS, getCPC, shareProgress, isLoading } = useGame();
            const [tab, setTab] = useState("upgrades");
            const [toasts, setToasts] = useState([]);
            const [playerName, setPlayerName] = useState(() => localStorage.getItem("coin_clicker_name") || (tg?.initDataUnsafe?.user?.first_name || ""));
            const [showNameInput, setShowNameInput] = useState(false);
            const [nameInput, setNameInput] = useState("");
            const [leaderboard, setLeaderboard] = useState(loadLeaderboard);
            const prevAch = useRef([]);
            const prevQ = useRef([]);
            const toastId = useRef(0);
            const [bankAmount, setBankAmount] = useState("");
            const [bankPlan, setBankPlan] = useState(0);
            const [bankError, setBankError] = useState("");

            useEffect(() => {
                if (state && prevAch.current.length === 0) {
                    prevAch.current = state.achievements;
                    prevQ.current = state.quests;
                }
            }, [state]);

            const addToast = (msg, icon, color = "#f59e0b") => {
                const id = toastId.current++;
                setToasts((t) => [...t, { id, msg, icon, color }]);
                setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3500);
            };

            useEffect(() => {
                if (!state) return;
                state.achievements.forEach((a) => {
                    const was = prevAch.current.find((x) => x?.id === a.id);
                    if (a.unlocked && was && !was.unlocked) {
                        const def = ACHIEVEMENTS.find((x) => x.id === a.id);
                        addToast(`${def?.name}`, def?.icon || "🏆", "#8b5cf6");
                        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
                    }
                });
                prevAch.current = state.achievements;
            }, [state?.achievements]);

            useEffect(() => {
                if (!state) return;
                state.quests.forEach((q) => {
                    const was = prevQ.current.find((x) => x?.id === q.id);

                                                        <div key={r.id} style={{ background: owned ? "rgba(16,185,129,0.15)" : "rgba(120,53,15,0.2)", border: `1px solid ${owned ? "rgba(16,185,129,0.4)" : "rgba(120,53,15,0.3)"}`, borderRadius: 14, padding: 14 }}>
                                                            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                                                                <span style={{ fontSize: 28 }}>{r.icon}</span>
                                                                <div>
                                                                    <div style={{ color: "#fde68a", fontWeight: 700, fontSize: 13 }}>{r.name}</div>
                                                                    <div style={{ color: "#92400e", fontSize: 10 }}>{r.desc}</div>
                                                                </div>
                                                            </div>
                                                            <button onClick={() => buyRelic(r.id)} disabled={owned || !canBuy} style={{ width: "100%", background: owned ? "rgba(16,185,129,0.2)" : canBuy ? "#7c3aed" : "rgba(0,0,0,0.3)", color: owned ? "#6ee7b7" : canBuy ? "#fff" : "#6b7280", border: "none", borderRadius: 8, padding: "6px", fontSize: 12, cursor: owned || !canBuy ? "default" : "pointer", fontWeight: 700 }}>
                                                                {owned ? "✅ Получено" : `✨ ${r.cost} очков`}
                                                            </button>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {tab === "quests" && (
                                        <div>
                                            <h2 style={{ color: "#fbbf24", fontWeight: 800, fontSize: 16, marginBottom: 12 }}>📜 Квесты</h2>
                                            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                                                {QUESTS.map((qDef) => {
                                                    const q = state.quests.find((x) => x.id === qDef.id) || {};
                                                    const pct = qDef.condition(state) ? 100 : 0;
                                                    return (
                                                        <div key={qDef.id} style={{ display: "flex", alignItems: "center", gap: 12, background: q.claimed ? "rgba(16,185,129,0.1)" : q.completed ? "rgba(251,191,36,0.1)" : "rgba(120,53,15,0.2)", border: `1px solid ${q.claimed ? "rgba(16,185,129,0.3)" : q.completed ? "rgba(251,191,36,0.3)" : "rgba(120,53,15,0.3)"}`, borderRadius: 14, padding: "10px 14px" }}>
                                                            <span style={{ fontSize: 24 }}>{qDef.icon}</span>
                                                            <div style={{ flex: 1 }}>
                                                                <div style={{ color: "#fde68a", fontWeight: 700, fontSize: 13 }}>{qDef.name}</div>
                                                                <div style={{ color: "#92400e", fontSize: 11 }}>{qDef.desc}</div>
                                                                <div style={{ marginTop: 4, background: "rgba(0,0,0,0.3)", borderRadius: 99, height: 3 }}>
                                                                    <div style={{ height: 3, borderRadius: 99, background: "#f59e0b", width: `${pct}%`, transition: "width 0.5s" }} />
                                                                </div>
                                                            </div>
                                                            <div style={{ textAlign: "right", minWidth: 90 }}>
                                                                <div style={{ color: "#6ee7b7", fontSize: 10, marginBottom: 4 }}>
                                                                    {qDef.rewardType === "coins" ? `💰 ${fmt(qDef.reward)}` : `✨ ${qDef.reward} очков`}
                                                                </div>
                                                                <button onClick={() => claimQuest(qDef.id)} disabled={!q.completed || q.claimed} style={{ background: q.claimed ? "rgba(16,185,129,0.2)" : q.completed ? "#b45309" : "rgba(0,0,0,0.3)", color: q.claimed ? "#6ee7b7" : q.completed ? "#fff" : "#6b7280", border: "none", borderRadius: 8, padding: "4px 10px", fontSize: 11, cursor: q.completed && !q.claimed ? "pointer" : "default", fontWeight: 700 }}>
                                                                    {q.claimed ? "✅ Забрано" : q.completed ? "🎁 Забрать!" : "Заблок."}
                                                                </button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {tab === "bank" && (
                                        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                                            <h2 style={{ color: "#fbbf24", fontWeight: 800, fontSize: 16 }}>🏦 Банк Монет</h2>
                                            <div style={{ background: "rgba(6,78,59,0.3)", border: "1px solid rgba(16,185,129,0.3)", borderRadius: 16, padding: 16 }}>
                                                <div style={{ color: "#6ee7b7", fontSize: 11, textTransform: "uppercase", letterSpacing: 1 }}>Готово к снятию</div>
                                                <div style={{ fontSize: 32, fontWeight: 900, color: "#34d399" }}>{fmt(state.bankBalance)} 💰</div>
                                                {state.bankBalance > 0 && <button onClick={withdrawBank} style={{ marginTop: 8, background: "#059669", color: "#fff", border: "none", borderRadius: 8, padding: "8px 20px", cursor: "pointer", fontWeight: 700 }}>💵 Снять всё</button>}
                                            </div>
                                            <div style={{ background: "rgba(120,53,15,0.25)", border: "1px solid rgba(120,53,15,0.4)", borderRadius: 16, padding: 16 }}>
                                                <div style={{ color: "#fbbf24", fontWeight: 700, marginBottom: 10 }}>📥 Открыть вклад</div>
                                                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginBottom: 10 }}>
                                                    {BANK_DEPOSITS.map((p, i) => (
                                                        <button key={i} onClick={() => setBankPlan(i)} style={{ border: `1px solid ${bankPlan === i ? "#fbbf24" : "rgba(120,53,15,0.5)"}`, background: bankPlan === i ? "rgba(251,191,36,0.15)" : "rgba(0,0,0,0.2)", borderRadius: 8, padding: 8, cursor: "pointer", textAlign: "center" }}>
                                                            <div style={{ color: "#fde68a", fontSize: 11, fontWeight: 700 }}>{p.label}</div>
                                                            <div style={{ color: "#6ee7b7", fontSize: 12, fontWeight: 800 }}>+{p.interest}%</div>
                                                        </button>
                                                    ))}
                                                </div>
                                                <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
                                                    <input value={bankAmount} onChange={(e) => { setBankAmount(e.target.value); setBankError(""); }} placeholder="Сумма..." style={{ flex: 1, background: "rgba(0,0,0,0.4)", border: "1px solid rgba(120,53,15,0.5)", borderRadius: 8, padding: "7px 12px", color: "#fff", fontSize: 13 }} />
                                                    <button onClick={() => setBankAmount(String(Math.floor(state.coins)))} style={{ background: "rgba(120,53,15,0.5)", color: "#fde68a", border: "none", borderRadius: 8, padding: "7px 12px", cursor: "pointer", fontSize: 11, fontWeight: 700 }}>Макс</button>
                                                </div>
                                                {bankError && <div style={{ color: "#ef4444", fontSize: 11, marginBottom: 6 }}>{bankError}</div>}
                                                <button onClick={() => {
                                                    const num = parseFloat(bankAmount);
                                                    if (!num || num <= 0) { setBankError("Введите сумму!"); return; }
                                                    if (num > state.coins) { setBankError("Недостаточно монет!"); return; }
                                                    const p = BANK_DEPOSITS[bankPlan];
                                                    depositToBank(Math.floor(num), p.duration, p.interest, p.label);
                                                    setBankAmount(""); setBankError("");
                                                }} style={{ width: "100%", background: "#b45309", color: "#fff", border: "none", borderRadius: 8, padding: 8, cursor: "pointer", fontWeight: 700 }}>
                                                    Положить в банк
                                                </button>
                                            </div>
                                            {state.bankDeposits.length > 0 && (
                                                <div>
                                                    <div style={{ color: "#fbbf24", fontWeight: 700, marginBottom: 8 }}>📊 Активные вклады</div>
                                                    {state.bankDeposits.map((dep) => (
                                                        <div key={dep.id} style={{ background: "rgba(120,53,15,0.2)", border: "1px solid rgba(120,53,15,0.3)", borderRadius: 12, padding: 12, marginBottom: 8 }}>
                                                            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                                                                <span style={{ color: "#fde68a", fontWeight: 700, fontSize: 13 }}>{dep.label}</span>
                                                                <span style={{ color: "#6ee7b7", fontSize: 11 }}>+{dep.interest}%</span>
                                                            </div>
                                                            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#92400e", marginBottom: 4 }}>
                                                                <span>Вложено: {fmt(dep.amount)}</span><span>Получите: {fmt(dep.amount * (1 + dep.interest / 100))}</span>
                                                            </div>
                                                            <div style={{ background: "rgba(0,0,0,0.3)", borderRadius: 99, height: 5 }}>
                                                                <div style={{ height: 5, borderRadius: 99, background: "linear-gradient(90deg,#f59e0b,#6ee7b7)", width: `${getDepositProgress(dep)}%`, transition: "width 1s" }} />
                                                            </div>
                                                            <div style={{ textAlign: "right", fontSize: 10, color: "#92400e", marginTop: 2 }}>
                                                                {getDepositProgress(dep) >= 100 ? "Готово! ✅" : `Осталось: ${getDepositTimeLeft(dep)}`}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {tab === "events" && (
                                        <div>
                                            <h2 style={{ color: "#fbbf24", fontWeight: 800, fontSize: 16, marginBottom: 4 }}>🎉 Случайные События</h2>
                                            <p style={{ color: "#92400e", fontSize: 11, marginBottom: 12 }}>События появляются случайно во время игры. Следи за баннером сверху!</p>
                                            {activeEv && (
                                                <div style={{ background: `${activeEv.color}22`, border: `1px solid ${activeEv.color}66`, borderRadius: 16, padding: 16, marginBottom: 12 }}>
                                                    <div style={{ fontSize: 32, marginBottom: 8 }}>{activeEv.icon}</div>
                                                    <div style={{ color: activeEv.color, fontWeight: 800, fontSize: 18 }}>{activeEv.name}</div>
                                                    <div style={{ color: "#e5e7eb", fontSize: 13, marginTop: 4 }}>{activeEv.desc}</div>
                                                    <div style={{ marginTop: 10, background: "rgba(0,0,0,0.3)", borderRadius: 99, height: 8 }}>
                                                        <div style={{ height: 8, borderRadius: 99, background: activeEv.color, transition: "width 1s", width: `${(eventSecsLeft / (EVENTS.find((e) => e.id === activeEv.id)?.duration || 1)) * 100}%` }} />
                                                    </div>
                                                    <div style={{ color: "#9ca3af", fontSize: 11, textAlign: "right", marginTop: 4 }}>{eventSecsLeft}с осталось</div>
                                                </div>
                                            )}
                                            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(200px,1fr))", gap: 10 }}>
                                                {EVENTS.map((ev) => (
                                                    <div key={ev.id} style={{ background: `${ev.color}11`, border: `1px solid ${ev.color}33`, borderRadius: 14, padding: 14 }}>
                                                        <span style={{ fontSize: 30 }}>{ev.icon}</span>
                                                        <div style={{ color: ev.color, fontWeight: 700, marginTop: 6 }}>{ev.name}</div>
                                                        <div style={{ color: "#9ca3af", fontSize: 11, marginTop: 4 }}>{ev.desc}</div>
                                                        <div style={{ color: "#6b7280", fontSize: 10, marginTop: 4 }}>Длит. {ev.duration}с</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {tab === "leaderboard" && (
                                        <div>
                                            <h2 style={{ color: "#fbbf24", fontWeight: 800, fontSize: 16, marginBottom: 4 }}>🥇 Таблица Лидеров</h2>
                                            <p style={{ color: "#92400e", fontSize: 11, marginBottom: 12 }}>Локальная доска — все игроки на этом устройстве. Установи имя для участия!</p>
                                            {!playerName && <div style={{ background: "rgba(251,191,36,0.1)", border: "1px solid rgba(251,191,36,0.3)", borderRadius: 12, padding: 12, marginBottom: 12, textAlign: "center" }}>
                                                <div style={{ color: "#fbbf24", marginBottom: 8 }}>Введи своё имя, чтобы попасть в рейтинг!</div>
                                                <button onClick={() => setShowNameInput(true)} style={{ background: "#b45309", color: "#fff", border: "none", borderRadius: 8, padding: "7px 18px", cursor: "pointer", fontWeight: 700 }}>👤 Ввести имя</button>
                                            </div>}
                                            {leaderboard.length === 0 ? (
                                                <div style={{ color: "#6b7280", textAlign: "center", marginTop: 40 }}>Пока пусто. Будь первым!</div>
                                            ) : (
                                                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                                                    {leaderboard.map((entry, i) => {
                                                        const medals = ["🥇", "🥈", "🥉"];
                                                        const isMe = entry.name === playerName;
                                                        return (
                                                            <div key={entry.name} style={{ display: "flex", alignItems: "center", gap: 12, background: isMe ? "rgba(251,191,36,0.15)" : "rgba(120,53,15,0.2)", border: `1px solid ${isMe ? "rgba(251,191,36,0.4)" : "rgba(120,53,15,0.3)"}`, borderRadius: 12, padding: "10px 14px" }}>
                                                                <span style={{ fontSize: 20, minWidth: 24, textAlign: "center" }}>{medals[i] || `#${i + 1}`}</span>
                                                                <span style={{ flex: 1, fontWeight: 700, color: isMe ? "#fbbf24" : "#fde68a" }}>{entry.name}{isMe ? " 👈" : ""}</span>
                                                                <span style={{ color: "#6ee7b7", fontWeight: 700, fontSize: 13 }}>{fmt(entry.score)}</span>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                            <button onClick={() => { if (playerName) { saveLeaderboard(playerName, state.totalAllTimeCoins); setLeaderboard(loadLeaderboard()); } }} style={{ marginTop: 12, background: "rgba(120,53,15,0.4)", color: "#fde68a", border: "1px solid rgba(120,53,15,0.5)", borderRadius: 8, padding: "7px 16px", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>
                                                🔄 Обновить
                                            </button>
                                        </div>
                                    )}

                                    {tab === "achievements" && (
                                        <div>
                                            <h2 style={{ color: "#fbbf24", fontWeight: 800, fontSize: 16, marginBottom: 12 }}>🏆 Достижения ({unlockedAch}/{ACHIEVEMENTS.length})</h2>
                                            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(160px,1fr))", gap: 8 }}>
                                                {ACHIEVEMENTS.map((a) => {
                                                    const unlocked = state.achievements.find((x) => x.id === a.id)?.unlocked;
                                                    return (
                                                        <div key={a.id} title={a.desc} style={{ background: unlocked ? "rgba(139,92,246,0.2)" : "rgba(0,0,0,0.3)", border: `1px solid ${unlocked ? "rgba(139,92,246,0.4)" : "rgba(120,53,15,0.2)"}`, borderRadius: 12, padding: 12, textAlign: "center", opacity: unlocked ? 1 : 0.4 }}>
                                                            <div style={{ fontSize: 28, marginBottom: 4, filter: unlocked ? "none" : "grayscale(1)" }}>{a.icon}</div>
                                                            <div style={{ color: "#fde68a", fontWeight: 700, fontSize: 11 }}>{a.name}</div>
                                                            <div style={{ color: "#92400e", fontSize: 10, marginTop: 2 }}>{a.desc}</div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {tab === "stats" && (
                                        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                                            <h2 style={{ color: "#fbbf24", fontWeight: 800, fontSize: 16 }}>📊 Статистика</h2>
                                            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                                                {[
                                                    ["💰 Монет сейчас", fmt(state.coins)],
                                                    ["📈 Всего заработано", fmt(state.totalCoins)],
                                                    ["🌍 За всё время", fmt(state.totalAllTimeCoins)],
                                                    ["👆 За клик", fmt(cpc)],
                                                    ["⚡ В секунду", fmt(cps)],
                                                    ["🖱️ Кликов", fmt(state.totalClicks)],
                                                    ["🖱️ Кликов всего", fmt(state.totalAllTimeClicks)],
                                                    ["⭐ Престиж", state.prestigeLevel],
                                                    ["🔥 Мега", state.megaPrestigeLevel],
                                                    ["🌈 Гипер", state.hyperPrestigeLevel],
                                                    ["✨ Очков престижа", state.prestigePoints],
                                                    ["⏱️ Время игры", formatPlayTime(state.playTime)],
                                                ].map(([l, v]) => (
                                                    <div key={l} style={{ background: "rgba(120,53,15,0.25)", border: "1px solid rgba(120,53,15,0.35)", borderRadius: 12, padding: 12 }}>
                                                        <div style={{ color: "#92400e", fontSize: 10 }}>{l}</div>
                                                        <div style={{ color: "#fde68a", fontWeight: 700, fontSize: 16, marginTop: 2 }}>{v}</div>
                                                    </div>
                                                ))}
                                            </div>
                                            <div style={{ border: "1px solid rgba(239,68,68,0.3)", borderRadius: 14, padding: 12 }}>
                                                <div style={{ color: "#ef4444", fontSize: 11, marginBottom: 8 }}>⚠️ Опасная зона</div>
                                                <button onClick={resetGame} style={{ width: "100%", background: "rgba(239,68,68,0.2)", color: "#ef4444", border: "1px solid rgba(239,68,68,0.3)", borderRadius: 8, padding: 8, cursor: "pointer", fontWeight: 700, fontSize: 13 }}>
                                                    🗑️ Сбросить всё
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById("root"));
        root.render(React.createElement(App));
    </script>
</body>
</html>
