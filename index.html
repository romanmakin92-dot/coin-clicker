<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>МонетоКликер — Полная версия</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(135deg, #0a0500 0%, #1a0800 100%); color: #fff; font-family: 'Segoe UI', sans-serif; padding: 16px; min-height: 100vh; }
        .coin-card { background: linear-gradient(135deg, rgba(120,53,15,0.5), rgba(180,83,9,0.3)); border: 1px solid rgba(251,191,36,0.3); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 16px; }
        .coins { font-size: 42px; font-weight: 900; color: #fef3c7; text-shadow: 0 0 30px rgba(251,191,36,0.6); }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .stat { background: rgba(120,53,15,0.4); border-radius: 10px; padding: 8px; }
        .stat-label { color: #92400e; font-size: 10px; }
        .stat-value { color: #fde68a; font-weight: 700; font-size: 13px; }
        .coin-btn { width: 180px; height: 180px; margin: 20px auto; background: radial-gradient(circle at 35% 35%, #fbbf24aa, #f59e0b33); border: 3px solid #fbbf2488; border-radius: 50%; font-size: 70px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; box-shadow: 0 0 40px rgba(251,191,36,0.3); }
        .coin-btn:active { transform: scale(0.93); }
        .tabs { display: flex; gap: 4px; background: rgba(120,53,15,0.2); border-radius: 14px; padding: 4px; overflow-x: auto; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 8px; border-radius: 10px; font-size: 12px; font-weight: bold; background: transparent; border: none; color: #a16207; cursor: pointer; }
        .tab-btn.active { background: #b45309; color: white; }
        .tab-content { background: rgba(120,53,15,0.15); border: 1px solid rgba(120,53,15,0.3); border-radius: 20px; padding: 16px; max-height: 450px; overflow-y: auto; }
        .item { display: flex; align-items: center; gap: 12px; background: rgba(120,53,15,0.2); border: 1px solid rgba(120,53,15,0.3); border-radius: 14px; padding: 10px; margin-bottom: 8px; }
        .item-icon { font-size: 28px; }
        .item-info { flex: 1; }
        .item-name { color: #fde68a; font-weight: 700; font-size: 13px; }
        .item-desc { color: #92400e; font-size: 11px; }
        .item-level { color: #6ee7b7; font-size: 10px; }
        .buy-btn { background: #b45309; border: none; border-radius: 8px; padding: 5px 12px; color: white; font-weight: 700; font-size: 11px; cursor: pointer; }
        .buy-btn:disabled { background: rgba(0,0,0,0.3); color: #6b7280; cursor: not-allowed; }
        .prestige-card { background: rgba(91,33,182,0.3); border: 1px solid rgba(139,92,246,0.3); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
        .relic-item { display: inline-block; background: rgba(120,53,15,0.2); border-radius: 12px; padding: 10px; margin: 5px; width: calc(33% - 10px); text-align: center; }
        .quest-item { background: rgba(120,53,15,0.2); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
        .progress-bar { background: rgba(0,0,0,0.3); border-radius: 99px; height: 4px; margin-top: 4px; }
        .progress-fill { height: 4px; border-radius: 99px; background: #f59e0b; width: 0%; }
        h2 { color: #fbbf24; font-size: 16px; margin-bottom: 12px; }
        .bank-deposit { background: rgba(6,78,59,0.3); border: 1px solid rgba(16,185,129,0.3); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
        .event-banner { position: fixed; top: 0; left: 0; right: 0; background: #f59e0b; color: #000; padding: 8px; text-align: center; font-weight: bold; z-index: 100; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes coinPop { 0% { opacity: 1; transform: scale(1.4); } 100% { opacity: 0; transform: scale(0.7); } }
        .particle { position: fixed; pointer-events: none; color: #fbbf24; font-weight: bold; font-size: 20px; z-index: 1000; animation: coinPop 0.5s ease-out forwards; }
    </style>
</head>
<body>

<div id="game">
    <div class="coin-card">
        <div class="coins" id="coins">0</div>
        <div class="stats">
            <div class="stat"><div class="stat-label">👆 За клик</div><div class="stat-value" id="cpc">1</div></div>
            <div class="stat"><div class="stat-label">⚡ В секунду</div><div class="stat-value" id="cps">0</div></div>
        </div>
        <div id="bankBalance" style="margin-top: 8px; font-size: 12px; color: #6ee7b7;"></div>
        <div id="prestigePoints" style="margin-top: 4px; font-size: 10px; color: #a78bfa;"></div>
    </div>

    <div class="coin-btn" id="coinBtn">💰</div>

    <div class="tabs" id="tabs">
        <button class="tab-btn" data-tab="upgrades">⚡ Апгрейды</button>
        <button class="tab-btn" data-tab="buildings">🏗️ Здания</button>
        <button class="tab-btn" data-tab="prestige">🌟 Престиж</button>
        <button class="tab-btn" data-tab="relics">💎 Реликвии</button>
        <button class="tab-btn" data-tab="quests">📜 Квесты</button>
        <button class="tab-btn" data-tab="bank">🏦 Банк</button>
        <button class="tab-btn" data-tab="events">🎉 События</button>
        <button class="tab-btn" data-tab="stats">📊 Статы</button>
    </div>

    <div id="tabContent" class="tab-content"></div>
</div>

<script>
    // ---------- ПОЛНЫЕ ДАННЫЕ ----------
    const UPGRADES = [
        { id: "sharp_nail", name: "Острый ноготь", icon: "👆", baseCost: 10, maxLevel: 50, cpc: 1, mult: 1.5 },
        { id: "golden_finger", name: "Золотой палец", icon: "✨", baseCost: 100, maxLevel: 30, cpc: 5, mult: 1.6 },
        { id: "lucky_charm", name: "Талисман удачи", icon: "🍀", baseCost: 500, maxLevel: 20, cpc: 10, mult: 1.7 },
        { id: "magic_glove", name: "Магическая перчатка", icon: "🧤", baseCost: 2000, maxLevel: 15, cpc: 25, mult: 1.8 },
        { id: "dragon_claw", name: "Коготь дракона", icon: "🐉", baseCost: 10000, maxLevel: 10, cpc: 100, mult: 2.0 },
        { id: "cosmic_fist", name: "Космический кулак", icon: "🌠", baseCost: 100000, maxLevel: 8, cpc: 500, mult: 2.2 },
        { id: "god_hand", name: "Рука бога", icon: "⚡", baseCost: 2000000, maxLevel: 5, cpc: 5000, mult: 2.5 },
        { id: "auto_clicker", name: "Авто-кликер", icon: "🤖", baseCost: 50, maxLevel: 40, cpc: 0, cps: 2, mult: 1.5 },
        { id: "miner", name: "Шахтёр", icon: "⛏️", baseCost: 300, maxLevel: 25, cpc: 0, cps: 10, mult: 1.6 },
        { id: "time_warp", name: "Искажение времени", icon: "⌛", baseCost: 2500, maxLevel: 15, cpc: 0, cps: 50, mult: 1.8 },
        { id: "quantum_tap", name: "Квантовый удар", icon: "🔮", baseCost: 500000, maxLevel: 10, cpc: 0, cps: 1000, mult: 2.0 }
    ];

    const BUILDINGS = [
        { id: "piggy_bank", name: "Копилка", icon: "🐷", baseCost: 150, cps: 5, mult: 1.15 },
        { id: "market", name: "Рынок", icon: "🏪", baseCost: 800, cps: 20, mult: 1.15 },
        { id: "factory", name: "Завод", icon: "🏭", baseCost: 5000, cps: 100, mult: 1.15 },
        { id: "casino", name: "Казино", icon: "🎰", baseCost: 25000, cps: 500, mult: 1.15 },
        { id: "bank_branch", name: "Банковский филиал", icon: "🏦", baseCost: 100000, cps: 2000, mult: 1.15 },
        { id: "crypto_farm", name: "Крипто-ферма", icon: "💻", baseCost: 500000, cps: 10000, mult: 1.15 },
        { id: "space_mine", name: "Космическая шахта", icon: "🚀", baseCost: 2000000, cps: 50000, mult: 1.15 },
        { id: "time_machine", name: "Машина времени", icon: "⏰", baseCost: 10000000, cps: 200000, mult: 1.15 },
        { id: "dark_matter", name: "Тёмная материя", icon: "🌑", baseCost: 100000000, cps: 2000000, mult: 1.15 },
        { id: "multiverse", name: "Мультивселенная", icon: "🌌", baseCost: 1000000000, cps: 20000000, mult: 1.15 },
        { id: "god_realm", name: "Царство богов", icon: "🏛️", baseCost: 50000000000, cps: 500000000, mult: 1.15 }
    ];

    const RELICS = [
        { id: "golden_egg", name: "Золотое Яйцо", icon: "🥚", cost: 1, type: "multiplier", value: 1.5 },
        { id: "ancient_coin", name: "Древняя Монета", icon: "🪙", cost: 3, type: "cpc", value: 1.5 },
        { id: "philosophers_stone", name: "Философский камень", icon: "💠", cost: 5, type: "cps", value: 2.0 },
        { id: "infinity_gem", name: "Камень Бесконечности", icon: "💎", cost: 10, type: "multiplier", value: 3.0 },
        { id: "time_crystal", name: "Кристалл Времени", icon: "🔷", cost: 20, type: "cps", value: 5.0 },
        { id: "void_heart", name: "Сердце Пустоты", icon: "🖤", cost: 50, type: "multiplier", value: 10.0 },
        { id: "cosmic_core", name: "Космическое Ядро", icon: "⭐", cost: 100, type: "multiplier", value: 50.0 }
    ];

    const QUESTS = [
        { id: "q1", name: "Кликер", desc: "50 кликов", icon: "👆", condition: (s) => s.totalClicks >= 50, reward: 500, rewardType: "coins" },
        { id: "q2", name: "Маньяк кликов", desc: "500 кликов", icon: "🖱️", condition: (s) => s.totalClicks >= 500, reward: 5000, rewardType: "coins" },
        { id: "q3", name: "Кликер-бог", desc: "5000 кликов", icon: "⚡", condition: (s) => s.totalClicks >= 5000, reward: 50000, rewardType: "coins" },
        { id: "q4", name: "Накопитель", desc: "1000 монет", icon: "💰", condition: (s) => s.totalCoins >= 1000, reward: 2000, rewardType: "coins" },
        { id: "q5", name: "Торговец", desc: "100000 монет", icon: "💎", condition: (s) => s.totalCoins >= 100000, reward: 200000, rewardType: "coins" },
        { id: "q6", name: "Капиталист", desc: "10 млн монет", icon: "🏦", condition: (s) => s.totalCoins >= 10000000, reward: 20000000, rewardType: "coins" },
        { id: "q7", name: "Застройщик", desc: "5 зданий одного типа", icon: "🏗️", condition: (s) => s.buildings.some(b => b.count >= 5), reward: 10000, rewardType: "coins" },
        { id: "q8", name: "Магнат", desc: "25 зданий одного типа", icon: "🏙️", condition: (s) => s.buildings.some(b => b.count >= 25), reward: 500000, rewardType: "coins" },
        { id: "q9", name: "Перерождение", desc: "1 престиж", icon: "🌟", condition: (s) => s.prestigeLevel >= 1, reward: 1, rewardType: "prestige" },
        { id: "q10", name: "Ветеран", desc: "3 престижа", icon: "🌠", condition: (s) => s.prestigeLevel >= 3, reward: 3, rewardType: "prestige" },
        { id: "q11", name: "Империя", desc: "Все типы зданий", icon: "👑", condition: (s) => s.buildings.every(b => b.count > 0), reward: 100000, rewardType: "coins" }
    ];

    const EVENTS = [
        { id: "coin_rain", name: "Золотой дождь", desc: "x3 к доходу на 30 сек!", icon: "🌧️", duration: 30, multiplier: 3, color: "#f59e0b" },
        { id: "frenzy", name: "Монетное безумие", desc: "x7 к кликам на 15 сек!", icon: "🌀", duration: 15, clickMult: 7, color: "#8b5cf6" },
        { id: "lucky_day", name: "Счастливый день", desc: "x5 ко всему на 20 сек!", icon: "🍀", duration: 20, multiplier: 5, color: "#10b981" },
        { id: "time_boost", name: "Ускорение времени", desc: "x10 к доходу на 10 сек!", icon: "⚡", duration: 10, cpsMult: 10, color: "#06b6d4" }
    ];

    const BANK_DEPOSITS = [
        { label: "1 минута", duration: 1, interest: 2, minAmount: 100 },
        { label: "5 минут", duration: 5, interest: 12, minAmount: 500 },
        { label: "15 минут", duration: 15, interest: 40, minAmount: 2000 },
        { label: "1 час", duration: 60, interest: 200, minAmount: 10000 },
        { label: "6 часов", duration: 360, interest: 1500, minAmount: 50000 }
    ];

    const PRESTIGE_REQ = 1000000;
    const MEGA_PRESTIGE_REQ = 10;
    const HYPER_PRESTIGE_REQ = 3;

    // ---------- СОСТОЯНИЕ ----------
    let gameState = {
        coins: 0,
        totalCoins: 0,
        totalClicks: 0,
        prestigeLevel: 0,
        megaPrestigeLevel: 0,
        hyperPrestigeLevel: 0,
        prestigeMultiplier: 1,
        megaPrestigeMultiplier: 1,
        hyperPrestigeMultiplier: 1,
        prestigePoints: 0,
        totalPrestigePoints: 0,
        upgrades: UPGRADES.map(u => ({ id: u.id, level: 0 })),
        buildings: BUILDINGS.map(b => ({ id: b.id, count: 0 })),
        relics: RELICS.map(r => ({ id: r.id, owned: false })),
        quests: QUESTS.map(q => ({ id: q.id, completed: false, claimed: false })),
        bankBalance: 0,
        bankDeposits: [],
        activeEvent: null,
        eventEndsAt: 0,
        eventMultiplier: 1,
        eventClickMult: 1,
        eventCpsMult: 1
    };

    // Загрузка/сохранение
    function loadGame() {
        const saved = localStorage.getItem("coinclicker_full_save");
        if (saved) {
            try {
                const data = JSON.parse(saved);
                gameState = { ...gameState, ...data };
                gameState.upgrades = UPGRADES.map(u => {
                    const found = data.upgrades?.find(x => x.id === u.id);
                    return found || { id: u.id, level: 0 };
                });
                gameState.buildings = BUILDINGS.map(b => {
                    const found = data.buildings?.find(x => x.id === b.id);
                    return found || { id: b.id, count: 0 };
                });
                gameState.relics = RELICS.map(r => {
                    const found = data.relics?.find(x => x.id === r.id);
                    return found || { id: r.id, owned: false };
                });
                gameState.quests = QUESTS.map(q => {
                    const found = data.quests?.find(x => x.id === q.id);
                    return found || { id: q.id, completed: false, claimed: false };
                });
            } catch(e) {}
        }
    }

    function saveGame() {
        localStorage.setItem("coinclicker_full_save", JSON.stringify(gameState));
    }

    // Расчёты
    function getRelicMult(type) {
        let mult = 1;
        gameState.relics.forEach(r => {
            if (!r.owned) return;
            const def = RELICS.find(x => x.id === r.id);
            if (def.type === "multiplier") mult *= def.value;
            if (def.type === type) mult *= def.value;
        });
        return mult;
    }

    function calcCPC() {
        let bonus = 0;
        gameState.upgrades.forEach(u => {
            const def = UPGRADES.find(x => x.id === u.id);
            if (def) bonus += (def.cpc || 0) * u.level;
        });
        const base = 1 + bonus;
        const relicMult = getRelicMult("cpc");
        let mult = gameState.prestigeMultiplier * gameState.megaPrestigeMultiplier * gameState.hyperPrestigeMultiplier * relicMult;
        if (gameState.activeEvent && gameState.eventClickMult > 1) mult *= gameState.eventClickMult;
        return Math.floor(base * mult);
    }

    function calcCPS() {
        let fromUps = 0;
        let fromBlds = 0;
        gameState.upgrades.forEach(u => {
            const def = UPGRADES.find(x => x.id === u.id);
            if (def && def.cps) fromUps += def.cps * u.level;
        });
        gameState.buildings.forEach(b => {
            const def = BUILDINGS.find(x => x.id === b.id);
            if (def) fromBlds += def.cps * b.count;
        });
        const relicMult = getRelicMult("cps");
        let mult = gameState.prestigeMultiplier * gameState.megaPrestigeMultiplier * gameState.hyperPrestigeMultiplier * relicMult;
        if (gameState.activeEvent && gameState.eventMultiplier > 1) mult *= gameState.eventMultiplier;
        if (gameState.activeEvent && gameState.eventCpsMult > 1) mult *= gameState.eventCpsMult;
        return Math.floor((fromUps + fromBlds) * mult);
    }

    function formatNumber(n) {
        if (typeof n !== 'number' || isNaN(n)) n = 0;
        if (n >= 1e18) return (n/1e18).toFixed(2) + "Кв";
        if (n >= 1e15) return (n/1e15).toFixed(2) + "Кд";
        if (n >= 1e12) return (n/1e12).toFixed(2) + "Т";
        if (n >= 1e9) return (n/1e9).toFixed(2) + "М";
        if (n >= 1e6) return (n/1e6).toFixed(2) + "млн";
        if (n >= 1e3) return (n/1e3).toFixed(1) + "к";
        return Math.floor(n).toString();
    }

    // Игровые действия
    function addParticle(x, y, value) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.innerText = `+${formatNumber(value)}`;
        particle.style.left = (x - 20) + 'px';
        particle.style.top = (y - 20) + 'px';
        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 500);
    }

    function clickCoin(e) {
        const cpc = calcCPC();
        gameState.coins += cpc;
        gameState.totalCoins += cpc;
        gameState.totalClicks++;
        
        const rect = document.getElementById("coinBtn").getBoundingClientRect();
        const x = rect.left + rect.width/2;
        const y = rect.top + rect.height/2;
        addParticle(x, y, cpc);
        
        const btn = document.getElementById("coinBtn");
        btn.style.transform = "scale(0.93)";
        setTimeout(() => btn.style.transform = "scale(1)", 100);
        
        updateUI();
        saveGame();
        checkQuests();
    }

    function buyUpgrade(id) {
        const def = UPGRADES.find(u => u.id === id);
        const saved = gameState.upgrades.find(u => u.id === id);
        if (!def || !saved || saved.level >= def.maxLevel) return;
        const cost = Math.floor(def.baseCost * Math.pow(def.mult, saved.level));
        if (gameState.coins < cost) return;
        gameState.coins -= cost;
        saved.level++;
        updateUI();
        saveGame();
    }

    function buyBuilding(id) {
        const def = BUILDINGS.find(b => b.id === id);
        const saved = gameState.buildings.find(b => b.id === id);
        if (!def || !saved) return;
        const cost = Math.floor(def.baseCost * Math.pow(def.mult, saved.count));
        if (gameState.coins < cost) return;
        gameState.coins -= cost;
        saved.count++;
        updateUI();
        saveGame();
        checkQuests();
    }

    function buyRelic(id) {
        const def = RELICS.find(r => r.id === id);
        const saved = gameState.relics.find(r => r.id === id);
        if (!def || saved.owned) return;
        if (gameState.prestigePoints < def.cost) return;
        gameState.prestigePoints -= def.cost;
        saved.owned = true;
        updateUI();
        saveGame();
    }

    function doPrestige() {
        if (gameState.totalCoins < PRESTIGE_REQ) return;
        const pts = Math.floor(Math.log10(gameState.totalCoins / PRESTIGE_REQ) * 3 + 1);
        gameState.prestigeLevel++;
        gameState.prestigeMultiplier = 1 + gameState.prestigeLevel * 0.5 + gameState.megaPrestigeLevel * 2 + gameState.hyperPrestigeLevel * 10;
        gameState.prestigePoints += pts;
        gameState.totalPrestigePoints += pts;
        gameState.coins = 0;
        gameState.totalCoins = 0;
        gameState.upgrades.forEach(u => u.level = 0);
        gameState.buildings.forEach(b => b.count = 0);
        updateUI();
        saveGame();
        checkQuests();
    }

    function doMegaPrestige() {
        if (gameState.prestigeLevel < MEGA_PRESTIGE_REQ) return;
        gameState.megaPrestigeLevel++;
        gameState.megaPrestigeMultiplier = 1 + gameState.megaPrestigeLevel * 5 + gameState.hyperPrestigeLevel * 50;
        gameState.prestigeLevel = 0;
        gameState.prestigeMultiplier = 1;
        gameState.coins = 0;
        gameState.totalCoins = 0;
        gameState.upgrades.forEach(u => u.level = 0);
        gameState.buildings.forEach(b => b.count = 0);
        updateUI();
        saveGame();
    }

    function doHyperPrestige() {
        if (gameState.megaPrestigeLevel < HYPER_PRESTIGE_REQ) return;
        gameState.hyperPrestigeLevel++;
        gameState.hyperPrestigeMultiplier = 1 + gameState.hyperPrestigeLevel * 100;
        gameState.prestigeLevel = 0;
        gameState.megaPrestigeLevel = 0;
        gameState.prestigeMultiplier = 1;
        gameState.megaPrestigeMultiplier = 1;
        gameState.coins = 0;
        gameState.totalCoins = 0;
        gameState.upgrades.forEach(u => u.level = 0);
        gameState.buildings.forEach(b => b.count = 0);
        updateUI();
        saveGame();
    }

    function claimQuest(id) {
        const q = gameState.quests.find(x => x.id === id);
        const def = QUESTS.find(x => x.id === id);
        if (!q || !q.completed || q.claimed) return;
        q.claimed = true;
        if (def.rewardType === "coins") {
            gameState.coins += def.reward;
            gameState.totalCoins += def.reward;
        } else if (def.rewardType === "prestige") {
            gameState.prestigePoints += def.reward;
            gameState.totalPrestigePoints += def.reward;
        }
        updateUI();
        saveGame();
    }

    function checkQuests() {
        let changed = false;
        gameState.quests.forEach(q => {
            if (q.completed) return;
            const def = QUESTS.find(x => x.id === q.id);
            if (def && def.condition(gameState)) {
                q.completed = true;
                changed = true;
            }
        });
        if (changed) {
            updateUI();
            saveGame();
        }
    }

    // Банк
    function depositToBank(amount, duration, interest, label) {
        if (gameState.coins < amount) return;
        gameState.coins -= amount;
        gameState.bankDeposits.push({
            id: Date.now(),
            amount: amount,
            interest: interest,
            startTime: Date.now(),
            duration: duration,
            label: label
        });
        saveGame();
        updateUI();
    }

    function withdrawBank() {
        if (gameState.bankBalance <= 0) return;
        gameState.coins += gameState.bankBalance;
        gameState.totalCoins += gameState.bankBalance;
        gameState.bankBalance = 0;
        saveGame();
        updateUI();
    }

    function checkBankMaturity() {
        let changed = false;
        const now = Date.now();
        let newBalance = gameState.bankBalance;
        const remaining = [];
        gameState.bankDeposits.forEach(dep => {
            const elapsed = (now - dep.startTime) / 60000;
            if (elapsed >= dep.duration) {
                newBalance += dep.amount * (1 + dep.interest / 100);
                changed = true;
            } else {
                remaining.push(dep);
            }
        });
        if (changed) {
            gameState.bankBalance = newBalance;
            gameState.bankDeposits = remaining;
            saveGame();
            updateUI();
        }
    }

    // События
    function checkEvent() {
        if (gameState.activeEvent) {
            if (Date.now() >= gameState.eventEndsAt) {
                gameState.activeEvent = null;
                gameState.eventMultiplier = 1;
                gameState.eventClickMult = 1;
                gameState.eventCpsMult = 1;
                document.getElementById("eventBanner")?.remove();
                updateUI();
                saveGame();
            }
        } else if (gameState.totalCoins > 1000 && Math.random() < 0.003) {
            const ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
            gameState.activeEvent = ev.id;
            gameState.eventEndsAt = Date.now() + ev.duration * 1000;
            gameState.eventMultiplier = ev.multiplier || 1;
            gameState.eventClickMult = ev.clickMult || 1;
            gameState.eventCpsMult = ev.cpsMult || 1;
            
            const banner = document.createElement('div');
            banner.id = "eventBanner";
            banner.className = "event-banner";
            banner.style.background = ev.color;
            banner.innerHTML = `${ev.icon} ${ev.name} — ${ev.desc} <span id="eventTimer"></span>`;
            document.body.insertBefore(banner, document.body.firstChild);
            updateUI();
            saveGame();
        }
        
        if (gameState.activeEvent) {
            const banner = document.getElementById("eventBanner");
            if (banner) {
                const remaining = Math.max(0, Math.floor((gameState.eventEndsAt - Date.now()) / 1000));
                const timer = banner.querySelector("#eventTimer");
                if (timer) timer.innerText = `${remaining}с`;
            }
        }
    }

    // Пассивный доход
    let lastTick = Date.now();
    function passiveIncome() {
        const now = Date.now();
        const delta = Math.min((now - lastTick) / 1000, 0.1);
        if (delta >= 0.05) {
            const cps = calcCPS();
            const earned = cps * delta;
            if (earned > 0) {
                gameState.coins += earned;
                gameState.totalCoins += earned;
                updateUI();
                saveGame();
            }
            lastTick = now;
        }
        requestAnimationFrame(passiveIncome);
    }

    // Обновление UI
    let currentTab = "upgrades";

    function updateUI() {
        document.getElementById("coins").innerText = formatNumber(gameState.coins);
        document.getElementById("cpc").innerText = formatNumber(calcCPC());
        document.getElementById("cps").innerText = formatNumber(calcCPS());
        document.getElementById("prestigePoints").innerHTML = `✨ Очки престижа: ${gameState.prestigePoints} (всего: ${gameState.totalPrestigePoints})`;
        if (gameState.bankBalance > 0) {
            document.getElementById("bankBalance").innerHTML = `🏦 В банке: ${formatNumber(gameState.bankBalance)}`;
        } else {
            document.getElementById("bankBalance").innerHTML = "";
        }
        renderTab(currentTab);
    }

    function renderTab(tab) {
        currentTab = tab;
        const container = document.getElementById("tabContent");
        if (!container) return;
        
        if (tab === "upgrades") {
            container.innerHTML = `<h2>⚡ Улучшения</h2>`;
            UPGRADES.forEach(u => {
                const saved = gameState.upgrades.find(x => x.id === u.id);
                const level = saved?.level || 0;
                const cost = Math.floor(u.baseCost * Math.pow(u.mult, level));
                const maxed = level >= u.maxLevel;
                container.innerHTML += `
                    <div class="item">
                        <div class="item-icon">${u.icon}</div>
                        <div class="item-info">
                            <div class="item-name">${u.name}</div>
                            <div class="item-desc">${u.cpc > 0 ? `+${u.cpc} за клик` : `+${u.cps}/сек`}</div>
                            <div class="item-level">Ур. ${level}/${u.maxLevel}</div>
                        </div>
                        <button class="buy-btn" onclick="buyUpgrade('${u.id}')" ${maxed || gameState.coins < cost ? 'disabled' : ''}>
                            ${maxed ? '✅ Макс' : `💰 ${formatNumber(cost)}`}
                        </button>
                    </div>
                `;
            });
        }
        else if (tab === "buildings") {
            container.innerHTML = `<h2>🏗️ Здания</h2>`;
            BUILDINGS.forEach(b => {
                const saved = gameState.buildings.find(x => x.id === b.id);
                const count = saved?.count || 0;
                const cost = Math.floor(b.baseCost * Math.pow(b.mult, count));
                const total = b.cps * count;
                container.innerHTML += `
                    <div class="item">
                        <div class="item-icon">${b.icon}</div>
                        <div class="item-info">
                            <div class="item-name">${b.name}</div>
                            <div class="item-desc">+${formatNumber(b.cps)}/сек</div>
                            ${count > 0 ? `<div class="item-level">Кол-во: ${count} (${formatNumber(total)}/сек)</div>` : ''}
                        </div>
                        <button class="buy-btn" onclick="buyBuilding('${b.id}')" ${gameState.coins < cost ? 'disabled' : ''}>
                            💰 ${formatNumber(cost)}
                        </button>
                    </div>
                `;
            });
        }
        else if (tab === "prestige") {
            const progress = Math.min((gameState.totalCoins / PRESTIGE_REQ) * 100, 100);
            const megaProgress = Math.min((gameState.prestigeLevel / MEGA_PRESTIGE_REQ) * 100, 100);
            const hyperProgress = Math.min((gameState.megaPrestigeLevel / HYPER_PRESTIGE_REQ) * 100, 100);
            container.innerHTML = `
                <h2>🌟 Система перерождений</h2>
                <div class="prestige-card">
                    <div style="display:flex; justify-content:space-between"><span>⭐ Престиж: ${gameState.prestigeLevel}</span><span>✨ Множитель: x${gameState.prestigeMultiplier.toFixed(1)}</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                    <div style="font-size:11px">${formatNumber(gameState.totalCoins)} / ${formatNumber(PRESTIGE_REQ)}</div>
                    <button class="buy-btn" onclick="doPrestige()" ${gameState.totalCoins < PRESTIGE_REQ ? 'disabled' : ''} style="width:100%; margin-top:8px">✨ Переродиться</button>
                </div>
                <div class="prestige-card">
                    <div style="display:flex; justify-content:space-between"><span>🔥 Мега-престиж: ${gameState.megaPrestigeLevel}</span><span>Множитель: x${gameState.megaPrestigeMultiplier.toFixed(1)}</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${megaProgress}%"></div></div>
                    <div style="font-size:11px">${gameState.prestigeLevel} / ${MEGA_PRESTIGE_REQ} престижей</div>
                    <button class="buy-btn" onclick="doMegaPrestige()" ${gameState.prestigeLevel < MEGA_PRESTIGE_REQ ? 'disabled' : ''} style="width:100%; margin-top:8px">🔥 Мега-перерождение</button>
                </div>
                <div class="prestige-card">
                    <div style="display:flex; justify-content:space-between"><span>🌈 Гипер-престиж: ${gameState.hyperPrestigeLevel}</span><span>Множитель: x${gameState.hyperPrestigeMultiplier.toFixed(1)}</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${hyperProgress}%"></div></div>
                    <div style="font-size:11px">${gameState.megaPrestigeLevel} / ${HYPER_PRESTIGE_REQ} мега-престижей</div>
                    <button class="buy-btn" onclick="doHyperPrestige()" ${gameState.megaPrestigeLevel < HYPER_PRESTIGE_REQ ? 'disabled' : ''} style="width:100%; margin-top:8px">🌈 Гипер-перерождение</button>
                </div>
            `;
        }
        else if (tab === "relics") {
            container.innerHTML = `<h2>💎 Реликвии</h2><div style="display:flex; flex-wrap:wrap">`;
            RELICS.forEach(r => {
                const owned = gameState.relics.find(x => x.id === r.id)?.owned;
                container.innerHTML += `
                    <div class="relic-item">
                        <div style="font-size:32px">${r.icon}</div>
                        <div style="font-weight:700">${r.name}</div>
                        <div style="font-size:10px; color:#92400e">${r.type === 'multiplier' ? 'x' + r.value : '+' + Math.round((r.value-1)*100) + '%'}</div>
                        <button class="buy-btn" onclick="buyRelic('${r.id}')" ${owned || gameState.prestigePoints < r.cost ? 'disabled' : ''} style="margin-top:5px">
                            ${owned ? '✅ Получено' : `✨ ${r.cost} очков`}
                        </button>
                    </div>
                `;
            });
            container.innerHTML += `</div><div style="margin-top:12px; font-size:11px; color:#92400e">⭐ Реликвии покупаются за очки престижа и не сбрасываются</div>`;
        }
        else if (tab === "quests") {
            container.innerHTML = `<h2>📜 Квесты</h2>`;
            QUESTS.forEach(qDef => {
                const q = gameState.quests.find(x => x.id === qDef.id);
                const completed = q?.completed;
                const claimed = q?.claimed;
                container.innerHTML += `
                    <div class="quest-item">
                        <div style="display:flex; align-items:center; gap:8px">
                            <span style="font-size:24px">${qDef.icon}</span>
                            <div style="flex:1">
                                <div style="font-weight:700">${qDef.name}</div>
                                <div style="font-size:11px; color:#92400e">${qDef.desc}</div>
                                <div style="font-size:10px; color:#6ee7b7">Награда: ${qDef.rewardType === 'coins' ? formatNumber(qDef.reward) + ' монет' : qDef.reward + ' очков престижа'}</div>
                            </div>
                            <button class="buy-btn" onclick="claimQuest('${qDef.id}')" ${!completed || claimed ? 'disabled' : ''}>
                                ${claimed ? '✅ Забрано' : completed ? '🎁 Забрать' : '🔒 Закрыт'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }
        else if (tab === "bank") {
            container.innerHTML = `
                <h2>🏦 Банк</h2>
                <div class="bank-deposit">
                    <div style="font-size:20px">💰 ${formatNumber(gameState.bankBalance)}</div>
                    <div style="font-size:12px">Готово к снятию</div>
                    <button class="buy-btn" onclick="withdrawBank()" ${gameState.bankBalance <= 0 ? 'disabled' : ''} style="margin-top:8px">💵 Снять всё</button>
                </div>
                <h2 style="margin-top:12px">📥 Вклады</h2>
                <div id="depositsList"></div>
            `;
            const depositsDiv = document.getElementById("depositsList");
            if (depositsDiv) {
                depositsDiv.innerHTML = "";
                BANK_DEPOSITS.forEach((dep, i) => {
                    depositsDiv.innerHTML += `
                        <button onclick="depositPrompt(${i})" style="background:#b45309; border:none; border-radius:8px; padding:8px; margin:4px; color:white">
                            ${dep.label} +${dep.interest}%
                        </button>
                    `;
                });
            }
            if (gameState.bankDeposits.length > 0) {
                container.innerHTML += `<h2 style="margin-top:12px">📊 Активные</h2>`;
                gameState.bankDeposits.forEach(dep => {
                    const elapsed = (Date.now() - dep.startTime) / 60000;
                    const progress = Math.min((elapsed / dep.duration) * 100, 100);
                    container.innerHTML += `
                        <div class="bank-deposit">
                            <div>${dep.label} +${dep.interest}%</div>
                            <div>Вложено: ${formatNumber(dep.amount)} → Получите: ${formatNumber(dep.amount * (1 + dep.interest/100))}</div>
                            <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                        </div>
                    `;
                });
            }
        }
        else if (tab === "events") {
            container.innerHTML = `<h2>🎉 Случайные события</h2>`;
            if (gameState.activeEvent) {
                const ev = EVENTS.find(e => e.id === gameState.activeEvent);
                const remaining = Math.max(0, Math.floor((gameState.eventEndsAt - Date.now()) / 1000));
                container.innerHTML += `
                    <div class="prestige-card" style="background:${ev?.color}22; border-color:${ev?.color}">
                        <div style="font-size:32px">${ev?.icon}</div>
                        <div style="font-weight:700">${ev?.name}</div>
                        <div>${ev?.desc}</div>
                        <div class="progress-bar"><div class="progress-fill" style="width:${(remaining/ev?.duration)*100}%; background:${ev?.color}"></div></div>
                        <div>Осталось: ${remaining}с</div>
                    </div>
                `;
            } else {
                container.innerHTML += `<div style="color:#92400e">События появляются случайно во время игры. Следи за баннером!</div>`;
            }
            container.innerHTML += `<h2 style="margin-top:12px">📋 Список событий</h2>`;
            EVENTS.forEach(ev => {
                container.innerHTML += `
                    <div class="item" style="background:${ev.color}11; border-color:${ev.color}33">
                        <div class="item-icon">${ev.icon}</div>
                        <div class="item-info">
                            <div class="item-name">${ev.name}</div>
                            <div class="item-desc">${ev.desc}</div>
                        </div>
                    </div>
                `;
            });
        }
        else if (tab === "stats") {
            const cpc = calcCPC();
            const cps = calcCPS();
            container.innerHTML = `
                <h2>📊 Статистика</h2>
                <div class="item"><div class="item-info"><div class="item-name">💰 Монет сейчас</div></div><div>${formatNumber(gameState.coins)}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">📈 Всего заработано</div></div><div>${formatNumber(gameState.totalCoins)}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">🖱️ Кликов</div></div><div>${formatNumber(gameState.totalClicks)}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">👆 За клик</div></div><div>+${formatNumber(cpc)}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">⚡ В секунду</div></div><div>+${formatNumber(cps)}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">⭐ Престиж</div></div><div>${gameState.prestigeLevel} (x${gameState.prestigeMultiplier.toFixed(1)})</div></div>
                <div class="item"><div class="item-info"><div class="item-name">🔥 Мега-престиж</div></div><div>${gameState.megaPrestigeLevel} (x${gameState.megaPrestigeMultiplier.toFixed(1)})</div></div>
                <div class="item"><div class="item-info"><div class="item-name">🌈 Гипер-престиж</div></div><div>${gameState.hyperPrestigeLevel} (x${gameState.hyperPrestigeMultiplier.toFixed(1)})</div></div>
                <div class="item"><div class="item-info"><div class="item-name">✨ Очки престижа</div></div><div>${gameState.prestigePoints}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">🎖️ Всего очков</div></div><div>${gameState.totalPrestigePoints}</div></div>
            `;
        }
    }

    function depositPrompt(depositIndex) {
        const dep = BANK_DEPOSITS[depositIndex];
        const amount = prompt(`Сколько монет положить? (мин. ${formatNumber(dep.minAmount)})`, String(dep.minAmount));
        if (amount) {
            const num = parseInt(amount);
            if (!isNaN(num) && num >= dep.minAmount && num <= gameState.coins) {
                depositToBank(num, dep.duration, dep.interest, dep.label);
            } else {
                alert(`Введите сумму от ${formatNumber(dep.minAmount)} до ${formatNumber(gameState.coins)}`);
            }
        }
    }

    // Инициализация
    function init() {
        loadGame();
        updateUI();
        
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                renderTab(btn.dataset.tab);
            });
        });
        document.querySelector(".tab-btn").classList.add("active");
        
        document.getElementById("coinBtn").addEventListener("click", clickCoin);
        
        setInterval(() => {
            checkBankMaturity();
            updateUI();
        }, 1000);
        
        setInterval(() => {
            checkEvent();
            updateUI();
        }, 500);
        
        setInterval(() => checkQuests(), 500);
        
        lastTick = Date.now();
        requestAnimationFrame(passiveIncome);
    }
    
    init();
</script>
</body>
</html>
