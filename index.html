                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title: title, body: body })
            });
            
            if (response.ok) {
                alert("✅ Рекорд отправлен! Через 30 минут появится в топе.");
            } else {
                const error = await response.text();
                console.error(error);
                alert("❌ Ошибка отправки. Проверь токен.");
            }
        } catch(e) {
            alert("❌ Ошибка соединения");
        }
    };

    function getPrestigeBonus() { return gameState.prestigeLevel * 0.5; }
    function getMegaBonus() { return gameState.megaPrestigeLevel * 2; }
    function getHyperBonus() { return gameState.hyperPrestigeLevel * 5; }
    function getRelicBonus() { let bonus = 0; gameState.relics.forEach(r => { if (r.owned) { const def = RELICS.find(x => x.id === r.id); if (def) bonus += def.bonus; } }); return bonus; }
    function getTotalMultiplier() { return 1 + getPrestigeBonus() + getMegaBonus() + getHyperBonus() + getRelicBonus(); }

    function calcCPC() {
        let bonus = 0;
        gameState.upgrades.forEach(u => { const def = UPGRADES.find(x => x.id === u.id); if (def) bonus += (def.cpc || 0) * u.level; });
        const base = 1 + bonus;
        let mult = getTotalMultiplier();
        if (gameState.activeEvent && gameState.eventClickMult > 1) mult *= gameState.eventClickMult;
        return Math.floor(base * mult * gameState.globalQuestMultiplier);
    }

    function calcCPS() {
        let fromUps = 0, fromBlds = 0;
        gameState.upgrades.forEach(u => { const def = UPGRADES.find(x => x.id === u.id); if (def && def.cps) fromUps += def.cps * u.level; });
        gameState.buildings.forEach(b => { const def = BUILDINGS.find(x => x.id === b.id); if (def) fromBlds += def.cps * b.count; });
        let mult = getTotalMultiplier();
        if (gameState.activeEvent && gameState.eventMultiplier > 1) mult *= gameState.eventMultiplier;
        if (gameState.activeEvent && gameState.eventCpsMult > 1) mult *= gameState.eventCpsMult;
        return Math.floor((fromUps + fromBlds) * mult * gameState.globalQuestMultiplier);
    }

    function formatNumber(n) {
        if (typeof n !== 'number' || isNaN(n)) n = 0;
        if (n >= 1e18) return (n/1e18).toFixed(2) + "Кв";
        if (n >= 1e15) return (n/1e15).toFixed(2) + "Кд";
        if (n >= 1e12) return (n/1e12).toFixed(2) + "Т";
        if (n >= 1e9) return (n/1e9).toFixed(2) + "М";
        if (n >= 1e6) return (n/1e6).toFixed(2) + "млн";
        if (n >= 1e3) return (n/1e3).toFixed(1) + "к";
        return Math.floor(n).toString();
    }

    function addParticle(x, y, value) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.innerText = `+${formatNumber(value)}`;
        particle.style.left = (x - 20) + 'px';
        particle.style.top = (y - 20) + 'px';
        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 500);
    }

    // === ГЛОБАЛЬНЫЙ ТОП ===
    async function loadLeaderboard() {
        try {
            const response = await fetch('leaderboard.json?t=' + Date.now());
            const data = await response.json();
            return data;
        } catch(e) {
            console.error("Ошибка загрузки топа:", e);
            return { coins: [], prestige: [], mega: [], hyper: [] };
        }
    }

            <button class="leaderboard-select-btn ${currentLeaderboardType === 'mega' ? 'active' : ''}" data-type="mega">🔥 Мега</button>

    // Игровые действия
    window.clickCoin = function() {
        const cpc = calcCPC();
        gameState.coins += cpc;
        gameState.totalCoins += cpc;
        gameState.totalClicks++;
        const rect = document.getElementById("coinBtn").getBoundingClientRect();
        addParticle(rect.left + rect.width/2, rect.top + rect.height/2, cpc);
        const btn = document.getElementById("coinBtn");
        btn.style.transform = "scale(0.93)";
        setTimeout(() => btn.style.transform = "scale(1)", 100);
        updateUI();
        autoSaveToCloud();
        checkQuests();
    };

    window.buyUpgrade = function(id) {
        const def = UPGRADES.find(u => u.id === id);
        const saved = gameState.upgrades.find(u => u.id === id);
        if (!def || !saved || saved.level >= def.maxLevel) return;
        const cost = Math.floor(def.baseCost * Math.pow(def.mult, saved.level));
        if (gameState.coins < cost) return;
        gameState.coins -= cost;
        saved.level++;
        updateUI();
        autoSaveToCloud();
    };

    window.buyBuilding = function(id) {
        const def = BUILDINGS.find(b => b.id === id);
        const saved = gameState.buildings.find(b => b.id === id);
        if (!def || !saved) return;
        const cost = Math.floor(def.baseCost * Math.pow(def.mult, saved.count));
        if (gameState.coins < cost) return;
        gameState.coins -= cost;
        saved.count++;
        updateUI();
        autoSaveToCloud();
        checkQuests();
    };

    window.buyRelic = function(id) {
        const def = RELICS.find(r => r.id === id);
        const saved = gameState.relics.find(r => r.id === id);
        if (!def || saved.owned) return;
        if (gameState.prestigePoints < def.cost) return;
        gameState.prestigePoints -= def.cost;
        saved.owned = true;
        updateUI();
        autoSaveToCloud();
    };

    window.doPrestige = function() {
        if (gameState.coins < PRESTIGE_REQ) return;
        gameState.bankDeposits = [];
        gameState.prestigeLevel++;
        const pts = Math.floor(Math.log10(gameState.coins / PRESTIGE_REQ) * 3 + 1);
        gameState.prestigePoints += pts;
        gameState.totalPrestigePoints += pts;
        gameState.coins = 0;
        gameState.upgrades.forEach(u => u.level = 0);
        gameState.buildings.forEach(b => b.count = 0);
        updateUI();
        autoSaveToCloud();
        checkQuests();
    };

    window.doMegaPrestige = function() {
        if (gameState.coins < MEGA_PRESTIGE_REQ) return;
        gameState.bankDeposits = [];
        gameState.megaPrestigeLevel++;
        const pts = Math.floor(Math.log10(gameState.coins / MEGA_PRESTIGE_REQ) * 5 + 5);
        gameState.prestigePoints += pts;
        gameState.totalPrestigePoints += pts;
        gameState.coins = 0;
        gameState.upgrades.forEach(u => u.level = 0);
        gameState.buildings.forEach(b => b.count = 0);
        updateUI();
        autoSaveToCloud();
    };

    window.doHyperPrestige = function() {
        if (gameState.coins < HYPER_PRESTIGE_REQ) return;
        gameState.bankDeposits = [];
        gameState.hyperPrestigeLevel++;
        const pts = Math.floor(Math.log10(gameState.coins / HYPER_PRESTIGE_REQ) * 10 + 20);
        gameState.prestigePoints += pts;
        gameState.totalPrestigePoints += pts;
        gameState.coins = 0;
        gameState.upgrades.forEach(u => u.level = 0);
        gameState.buildings.forEach(b => b.count = 0);
        updateUI();
        autoSaveToCloud();
    };

    window.claimQuest = function(id) {
        const q = gameState.quests.find(x => x.id === id);
        const def = QUESTS.find(x => x.id === id);
        if (!q || !q.completed || q.claimed) return;
        q.claimed = true;
        if (def.rewardType === "coins") {
            gameState.coins += def.reward;
            gameState.totalCoins += def.reward;
        } else if (def.rewardType === "prestige") {
            gameState.prestigePoints += def.reward;
            gameState.totalPrestigePoints += def.reward;
        } else if (def.rewardType === "global_multiplier") {
            gameState.globalQuestMultiplier *= def.reward;
        }
        updateUI();
        autoSaveToCloud();
    };

    window.depositToBank = function(amount, duration, interest, label) {
        if (gameState.coins < amount) return;
        gameState.coins -= amount;
        gameState.bankDeposits.push({ id: Date.now(), amount, interest, startTime: Date.now(), duration, label });
        autoSaveToCloud();
        updateUI();
    };

    window.withdrawBank = function() {
        if (gameState.bankBalance <= 0) return;
        gameState.coins += gameState.bankBalance;
        gameState.totalCoins += gameState.bankBalance;
        gameState.bankBalance = 0;
        autoSaveToCloud();
        updateUI();
    };

    window.depositPrompt = function(index) {
        const dep = BANK_DEPOSITS[index];
        const amount = prompt(`Сколько монет положить? (мин. ${formatNumber(dep.minAmount)})`, String(dep.minAmount));
        if (amount) {
            const num = parseInt(amount);
            if (!isNaN(num) && num >= dep.minAmount && num <= gameState.coins) {
                window.depositToBank(num, dep.duration, dep.interest, dep.label);
            } else {
                alert(`Введите сумму от ${formatNumber(dep.minAmount)} до ${formatNumber(gameState.coins)}`);
            }
        }
    };

    function checkQuests() {
        let changed = false;
        gameState.quests.forEach(q => {
            if (q.completed) return;
            const def = QUESTS.find(x => x.id === q.id);
            if (def && def.condition(gameState)) {
                q.completed = true;
                changed = true;
            }
        });
        if (changed) {
            updateUI();
            autoSaveToCloud();
        }
    }

    function checkBankMaturity() {
        let changed = false;
        const now = Date.now();
        let newBalance = gameState.bankBalance;
        const remaining = [];
        gameState.bankDeposits.forEach(dep => {
            const elapsed = (now - dep.startTime) / 60000;
            if (elapsed >= dep.duration) {
                newBalance += dep.amount * (1 + dep.interest / 100);
                changed = true;
            } else {
                remaining.push(dep);
            }
        });
        if (changed) {
            gameState.bankBalance = newBalance;
            gameState.bankDeposits = remaining;
            autoSaveToCloud();
            updateUI();
        }
    }

    function checkEvent() {
        if (gameState.activeEvent) {
            if (Date.now() >= gameState.eventEndsAt) {
                gameState.activeEvent = null;
                gameState.eventMultiplier = 1;
                gameState.eventClickMult = 1;
                gameState.eventCpsMult = 1;
                document.getElementById("eventBanner")?.remove();
                updateUI();
                autoSaveToCloud();
            }
        } else if (gameState.totalCoins > 1000 && Math.random() < 0.003) {
            const ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
            gameState.activeEvent = ev.id;
            gameState.eventEndsAt = Date.now() + ev.duration * 1000;
            gameState.eventMultiplier = ev.multiplier || 1;
            gameState.eventClickMult = ev.clickMult || 1;
            gameState.eventCpsMult = ev.cpsMult || 1;
            const banner = document.createElement('div');
            banner.id = "eventBanner";
            banner.className = "event-banner";
            banner.style.background = ev.color;
            banner.innerHTML = `${ev.icon} ${ev.name} — ${ev.desc} <span id="eventTimer"></span>`;
            document.body.insertBefore(banner, document.body.firstChild);
            updateUI();
            autoSaveToCloud();
        }
        if (gameState.activeEvent) {
            const banner = document.getElementById("eventBanner");
            if (banner) {
                const remaining = Math.max(0, Math.floor((gameState.eventEndsAt - Date.now()) / 1000));
                const timer = banner.querySelector("#eventTimer");
                if (timer) timer.innerText = `${remaining}с`;
            }
        }
    }

    let lastTick = Date.now();
    function passiveIncome() {
        const now = Date.now();
        const delta = Math.min((now - lastTick) / 1000, 0.1);
        if (delta >= 0.05) {
            const cps = calcCPS();
            const earned = cps * delta;
            if (earned > 0) {
                gameState.coins += earned;
                gameState.totalCoins += earned;
                updateUI();
                autoSaveToCloud();
            }
            lastTick = now;
        }
        requestAnimationFrame(passiveIncome);
    }

    function updateUI() {
        document.getElementById("coins").innerText = formatNumber(gameState.coins);
        document.getElementById("cpc").innerText = formatNumber(calcCPC());
        document.getElementById("cps").innerText = formatNumber(calcCPS());
        const totalMult = getTotalMultiplier() * gameState.globalQuestMultiplier;
        document.getElementById("totalMultiplier").innerHTML = `📊 Общий множитель: x${totalMult.toFixed(2)} (⭐+${getPrestigeBonus().toFixed(1)} 🔥+${getMegaBonus()} 🌈+${getHyperBonus()} 💎+${getRelicBonus().toFixed(1)} ✨x${gameState.globalQuestMultiplier})`;
        document.getElementById("prestigePoints").innerHTML = `✨ Очки престижа: ${gameState.prestigePoints} (всего: ${gameState.totalPrestigePoints})`;
        if (gameState.bankBalance > 0) document.getElementById("bankBalance").innerHTML = `🏦 В банке: ${formatNumber(gameState.bankBalance)}`;
        else document.getElementById("bankBalance").innerHTML = "";
        document.getElementById("nicknameBtn").innerHTML = gameState.nickname ? `👤 ${gameState.nickname} ✏️` : `👤 Установить ник`;
        renderTab(currentTab);
    }

            if (depositsDiv) {
                depositsDiv.innerHTML = "";
                BANK_DEPOSITS.forEach((dep, i) => {
                    depositsDiv.innerHTML += `<button class="buy-btn" onclick="depositPrompt(${i})" style="margin:4px">${dep.label} +${dep.interest}%</button>`;
                });
            }
        }
        else if (tab === "events") {
            let html = `<h2>🎉 Случайные события</h2>`;
            if (gameState.activeEvent) {
                const ev = EVENTS.find(e => e.id === gameState.activeEvent);
                const remaining = Math.max(0, Math.floor((gameState.eventEndsAt - Date.now()) / 1000));
                html += `<div class="prestige-card" style="background:${ev?.color}22; border-color:${ev?.color}">
                    <div style="font-size:32px">${ev?.icon}</div>
                    <div style="font-weight:700">${ev?.name}</div>
                    <div>${ev?.desc}</div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${(remaining/ev?.duration)*100}%; background:${ev?.color}"></div></div>
                    <div>Осталось: ${remaining}с</div>
                </div>`;
            } else {
                html += `<div style="color:#92400e">События появляются случайно во время игры.</div>`;
            }
            html += `<h2 style="margin-top:12px">📋 Список событий</h2>`;
            EVENTS.forEach(ev => {
                html += `<div class="item" style="background:${ev.color}11; border-color:${ev.color}33">
                    <div class="item-icon">${ev.icon}</div>
                    <div class="item-info">
                        <div class="item-name">${ev.name}</div>
                        <div class="item-desc">${ev.desc}</div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }
        else if (tab === "leaderboard") {
            await renderLeaderboard();
        }
        else if (tab === "stats") {
            container.innerHTML = `<h2>📊 Статистика</h2>
                <div class="item"><div class="item-info"><div class="item-name">💰 Монет сейчас</div></div><div>${formatNumber(gameState.coins)}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">📈 Всего заработано</div></div><div>${formatNumber(gameState.totalCoins)}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">🖱️ Кликов</div></div><div>${formatNumber(gameState.totalClicks)}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">👆 За клик</div></div><div>+${formatNumber(calcCPC())}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">⚡ В секунду</div></div><div>+${formatNumber(calcCPS())}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">⭐ Престиж</div></div><div>${gameState.prestigeLevel} (+${getPrestigeBonus().toFixed(1)})</div></div>
                <div class="item"><div class="item-info"><div class="item-name">🔥 Мега-престиж</div></div><div>${gameState.megaPrestigeLevel} (+${getMegaBonus()})</div></div>
                <div class="item"><div class="item-info"><div class="item-name">🌈 Гипер-престиж</div></div><div>${gameState.hyperPrestigeLevel} (+${getHyperBonus()})</div></div>
                <div class="item"><div class="item-info"><div class="item-name">💎 Реликвии</div></div><div>+${getRelicBonus().toFixed(1)}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">📊 Общий множитель</div></div><div>x${(getTotalMultiplier() * gameState.globalQuestMultiplier).toFixed(2)}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">✨ Очки престижа</div></div><div>${gameState.prestigePoints}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">🎖️ Всего очков</div></div><div>${gameState.totalPrestigePoints}</div></div>
                <div class="item"><div class="item-info"><div class="item-name">✨ Квест-множитель</div></div><div>x${gameState.globalQuestMultiplier}</div></div>
                <button onclick="sendRecord()" style="background:#b45309; border:none; border-radius:10px; padding:10px; margin-top:10px; width:100%; color:white; font-weight:bold; cursor:pointer">🌍 Отправить рекорд в глобальный топ</button>`;
        }
    }

    window.showNicknameModal = function() {
        const modal = document.createElement('div');
        modal.className = 'name-input-modal';
        modal.innerHTML = `<div class="name-input-card">
            <h3 style="color:#fbbf24">👤 Введите ник</h3>
            <input type="text" id="nicknameInput" maxlength="20" placeholder="Твой ник..." value="${gameState.nickname}">
            <div>
                <button id="saveNicknameBtn">Сохранить</button>
                <button id="cancelNicknameBtn">Отмена</button>
            </div>
        </div>`;
        document.body.appendChild(modal);
        document.getElementById('saveNicknameBtn').onclick = () => {
            const input = document.getElementById('nicknameInput');
            if (input.value.trim()) setNickname(input.value);
            modal.remove();
            updateUI();
        };
        document.getElementById('cancelNicknameBtn').onclick = () => modal.remove();
    };

    function saveToCloud() {
        if (!tg) return;
        const saveData = {
            coins: gameState.coins, totalCoins: gameState.totalCoins, totalClicks: gameState.totalClicks,
            prestigeLevel: gameState.prestigeLevel, megaPrestigeLevel: gameState.megaPrestigeLevel,
            hyperPrestigeLevel: gameState.hyperPrestigeLevel, prestigePoints: gameState.prestigePoints,
            totalPrestigePoints: gameState.totalPrestigePoints, nickname: gameState.nickname,
            upgrades: gameState.upgrades, buildings: gameState.buildings, relics: gameState.relics,
            quests: gameState.quests, bankBalance: gameState.bankBalance, bankDeposits: gameState.bankDeposits,
            globalQuestMultiplier: gameState.globalQuestMultiplier
        };
        tg.CloudStorage.setItem(CLOUD_SAVE_KEY, JSON.stringify(saveData), (err) => {});
    }

    function loadFromCloud() {
        if (!tg) {
            if (!gameState.nickname || gameState.nickname === "") {
                gameState.nickname = generateRandomNickname();
            }
            return;
        }
        tg.CloudStorage.getItem(CLOUD_SAVE_KEY, (err, data) => {
            if (err || !data) {
                if (!gameState.nickname || gameState.nickname === "") {
                    gameState.nickname = generateRandomNickname();
                    updateUI();
                }
                return;
            }
            try {
                const cloudData = JSON.parse(data);
                gameState.coins = cloudData.coins || 0;
                gameState.totalCoins = cloudData.totalCoins || 0;
                gameState.totalClicks = cloudData.totalClicks || 0;
                gameState.prestigeLevel = cloudData.prestigeLevel || 0;
                gameState.megaPrestigeLevel = cloudData.megaPrestigeLevel || 0;
                gameState.hyperPrestigeLevel = cloudData.hyperPrestigeLevel || 0;
                gameState.prestigePoints = cloudData.prestigePoints || 0;
                gameState.totalPrestigePoints = cloudData.totalPrestigePoints || 0;
                gameState.nickname = cloudData.nickname || "";
                gameState.bankBalance = cloudData.bankBalance || 0;
                gameState.bankDeposits = cloudData.bankDeposits || [];
                gameState.globalQuestMultiplier = cloudData.globalQuestMultiplier || 1;
                if (cloudData.upgrades) gameState.upgrades = UPGRADES.map(u => cloudData.upgrades?.find(x => x.id === u.id) || { id: u.id, level: 0 });
                if (cloudData.buildings) gameState.buildings = BUILDINGS.map(b => cloudData.buildings?.find(x => x.id === b.id) || { id: b.id, count: 0 });
                if (cloudData.relics) gameState.relics = RELICS.map(r => cloudData.relics?.find(x => x.id === r.id) || { id: r.id, owned: false });
                if (cloudData.quests) gameState.quests = QUESTS.map(q => cloudData.quests?.find(x => x.id === q.id) || { id: q.id, completed: false, claimed: false });
                if (!gameState.nickname || gameState.nickname === "") gameState.nickname = generateRandomNickname();
                updateUI();
                checkQuests();
            } catch(e) {}
        });
    }

    function autoSaveToCloud() {
        if (saveTimeout) clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            saveToCloud();
            localStorage.setItem("coinclicker_backup", JSON.stringify({
                coins: gameState.coins, totalCoins: gameState.totalCoins, totalClicks: gameState.totalClicks,
                prestigeLevel: gameState.prestigeLevel, megaPrestigeLevel: gameState.megaPrestigeLevel,
                hyperPrestigeLevel: gameState.hyperPrestigeLevel, prestigePoints: gameState.prestigePoints,
                totalPrestigePoints: gameState.totalPrestigePoints, nickname: gameState.nickname,
                upgrades: gameState.upgrades, buildings: gameState.buildings, relics: gameState.relics,
                quests: gameState.quests, bankBalance: gameState.bankBalance, bankDeposits: gameState.bankDeposits,
                globalQuestMultiplier: gameState.globalQuestMultiplier
            }));
        }, 1000);
    }

    window.addEventListener("beforeunload", function() {
        saveToCloud();
    });

    function init() {
        if (tg) loadFromCloud();
        else {
            const saved = localStorage.getItem("coinclicker_backup");
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    gameState.coins = data.coins || 0;
                    gameState.totalCoins = data.totalCoins || 0;
                    gameState.totalClicks = data.totalClicks || 0;
                    gameState.prestigeLevel = data.prestigeLevel || 0;
                    gameState.megaPrestigeLevel = data.megaPrestigeLevel || 0;
                    gameState.hyperPrestigeLevel = data.hyperPrestigeLevel || 0;
                    gameState.prestigePoints = data.prestigePoints || 0;
                    gameState.totalPrestigePoints = data.totalPrestigePoints || 0;
                    gameState.nickname = data.nickname || "";
                    gameState.bankBalance = data.bankBalance || 0;
                    gameState.bankDeposits = data.bankDeposits || [];
                    gameState.globalQuestMultiplier = data.globalQuestMultiplier || 1;
                    if (data.upgrades) gameState.upgrades = UPGRADES.map(u => data.upgrades?.find(x => x.id === u.id) || { id: u.id, level: 0 });
                    if (data.buildings) gameState.buildings = BUILDINGS.map(b => data.buildings?.find(x => x.id === b.id) || { id: b.id, count: 0 });
                    if (data.relics) gameState.relics = RELICS.map(r => data.relics?.find(x => x.id === r.id) || { id: r.id, owned: false });
                    if (data.quests) gameState.quests = QUESTS.map(q => data.quests?.find(x => x.id === q.id) || { id: q.id, completed: false, claimed: false });
                } catch(e) {}
            }
            if (!gameState.nickname || gameState.nickname === "") gameState.nickname = generateRandomNickname();
        }
        updateUI();

        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.addEventListener("click", async (e) => {
                const tabId = btn.getAttribute("data-tab");
                if (!tabId) return;
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                await renderTab(tabId);
            });
        });
        document.querySelector(".tab-btn").classList.add("active");
        document.getElementById("coinBtn").addEventListener("click", window.clickCoin);
        document.getElementById("nicknameBtn").addEventListener("click", window.showNicknameModal);

        setInterval(() => { checkBankMaturity(); updateUI(); }, 1000);
        setInterval(() => { checkEvent(); updateUI(); }, 500);
        setInterval(() => { checkQuests(); }, 500);
        setInterval(() => {
            if (gameState.totalCoins > 0 || gameState.totalClicks > 0) {
                saveToCloud();
            }
        }, 10000);
        lastTick = Date.now();
        requestAnimationFrame(passiveIncome);
    }

    init();
</script>
</body>
</html>
