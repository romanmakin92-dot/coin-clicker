name: Update Leaderboard

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run leaderboard update script
        env:
          TOKEN_FOR_ACTIONS: ${{ secrets.TOKEN_FOR_ACTIONS }}
        run: python .github/scripts/update_leaderboard.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Автообновление таблицы лидеров"
          file_pattern: "leaderboard.json"
